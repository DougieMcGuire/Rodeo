<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Tap Cap - Creatures</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;600;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e1a; }
body { 
  display: flex; justify-content: center; align-items: center; 
  font-family: 'Fredoka', sans-serif;
  touch-action: manipulation;
}

#gameContainer {
  position: relative;
  width: 100vw; height: 100vh;
  max-width: 480px;
  overflow: hidden;
  background: #0d1a2e;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

/* ===== UI OVERLAYS ===== */
.overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center;
  z-index: 10;
  transition: opacity 0.3s ease;
}
.overlay.hidden { opacity: 0; pointer-events: none; }

/* ===== MENU SCREEN ===== */
#menuScreen {
  justify-content: flex-start;
  padding-top: 6vh;
  background: transparent;
}

.logo-container {
  display: flex; flex-direction: column; align-items: center;
  margin-bottom: 1vh;
}

.logo-tapcap {
  position: relative;
  width: 140px; height: 60px;
  margin-bottom: -8px;
}
.logo-tapcap .tap, .logo-tapcap .cap {
  position: absolute;
  font-family: 'Bungee', cursive;
  font-size: 28px;
  padding: 2px 10px;
  border-radius: 6px;
  line-height: 1.1;
  letter-spacing: 1px;
}
.logo-tapcap .tap {
  top: 0; left: 10px;
  background: #e63946;
  color: #fff;
  transform: rotate(-5deg);
  box-shadow: 0 3px 0 #a8202c;
}
.logo-tapcap .cap {
  top: 24px; left: 58px;
  background: #ffbe0b;
  color: #1a1a2e;
  transform: rotate(3deg);
  box-shadow: 0 3px 0 #c99400;
}

.logo-creatures {
  font-family: 'Bungee', cursive;
  font-size: 52px;
  color: #fff;
  text-shadow: 
    0 4px 0 #8338ec,
    0 8px 0 #5a189a,
    3px 3px 15px rgba(131,56,236,0.5);
  letter-spacing: 2px;
  line-height: 1;
  -webkit-text-stroke: 1px rgba(0,0,0,0.2);
}

.character-name {
  font-family: 'Fredoka', sans-serif;
  font-weight: 700;
  font-size: 22px;
  color: #fff;
  margin: 2vh 0 1vh;
  text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  letter-spacing: 2px;
}

.character-showcase {
  position: relative;
  width: 200px; height: 240px;
  display: flex; justify-content: center; align-items: center;
}

.platform {
  position: absolute;
  bottom: 0;
  width: 180px; height: 30px;
  background: radial-gradient(ellipse at center, rgba(100,200,255,0.3) 0%, transparent 70%);
  border-radius: 50%;
  filter: blur(2px);
}

.char-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 48px;
  color: #ffbe0b;
  cursor: pointer;
  user-select: none;
  text-shadow: 0 2px 6px rgba(0,0,0,0.5);
  z-index: 5;
  transition: transform 0.15s ease;
  -webkit-user-select: none;
  line-height: 1;
}
.char-nav:active { transform: translateY(-50%) scale(1.3); }
.char-nav.left { left: 15%; }
.char-nav.right { right: 15%; }

.start-btn {
  margin-top: 3vh;
  padding: 14px 50px;
  font-family: 'Bungee', cursive;
  font-size: 22px;
  color: #fff;
  background: linear-gradient(180deg, #4cc764 0%, #2d9e42 100%);
  border: none;
  border-radius: 14px;
  cursor: pointer;
  box-shadow: 0 6px 0 #1e7a30, 0 8px 20px rgba(0,0,0,0.4);
  letter-spacing: 1px;
  transition: transform 0.1s ease;
  -webkit-user-select: none;
  user-select: none;
}
.start-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #1e7a30, 0 4px 10px rgba(0,0,0,0.4); }

/* ===== READY SCREEN ===== */
#readyScreen {
  justify-content: center;
  background: transparent;
}

.ready-text {
  font-family: 'Bungee', cursive;
  font-size: 52px;
  color: #ffbe0b;
  text-shadow: 0 4px 0 #c99400, 0 6px 15px rgba(0,0,0,0.5);
  text-align: center;
  line-height: 1.1;
  margin-top: 15vh;
}

.ready-subtitle {
  font-family: 'Fredoka', sans-serif;
  font-weight: 700;
  font-size: 16px;
  color: #fff;
  margin-top: 12px;
  text-shadow: 0 2px 6px rgba(0,0,0,0.5);
  letter-spacing: 1px;
}

.tap-icon {
  margin-top: 0;
  display: flex; flex-direction: column; align-items: center;
}
.tap-icon svg {
  width: 70px; height: 70px;
  filter: drop-shadow(0 3px 6px rgba(0,0,0,0.4));
  animation: tapBounce 1s ease-in-out infinite;
}
.tap-label {
  font-family: 'Bungee', cursive;
  font-size: 18px;
  color: #ffbe0b;
  margin-top: 4px;
  text-shadow: 0 2px 4px rgba(0,0,0,0.4);
}

@keyframes tapBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

/* ===== HUD ===== */
#hud {
  position: absolute; top: 0; left: 0; width: 100%;
  padding: 12px 16px;
  display: flex; justify-content: space-between; align-items: center;
  z-index: 8;
  pointer-events: none;
}
#hud.hidden { display: none; }

.hud-score {
  display: flex; align-items: center; gap: 8px;
}
.coin-icon {
  width: 36px; height: 36px;
  background: #ffbe0b;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3), inset 0 -2px 4px rgba(0,0,0,0.15);
  font-size: 18px;
  color: #1a1a2e;
  font-weight: 700;
}
.score-num {
  font-family: 'Bungee', cursive;
  font-size: 28px;
  color: #fff;
  text-shadow: 0 2px 6px rgba(0,0,0,0.5);
  min-width: 40px;
}

.sound-btn {
  width: 42px; height: 42px;
  background: #ffbe0b;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 3px 0 #c99400, 0 4px 10px rgba(0,0,0,0.3);
  pointer-events: all;
  transition: transform 0.1s;
}
.sound-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #c99400; }
.sound-btn svg { width: 22px; height: 22px; }

.logo-mini {
  position: relative;
  width: 60px; height: 32px;
  pointer-events: none;
}
.logo-mini .tap, .logo-mini .cap {
  position: absolute;
  font-family: 'Bungee', cursive;
  font-size: 13px;
  padding: 1px 5px;
  border-radius: 3px;
  line-height: 1.15;
}
.logo-mini .tap {
  top: 0; left: 2px;
  background: #e63946; color: #fff;
  transform: rotate(-5deg);
}
.logo-mini .cap {
  top: 13px; left: 24px;
  background: #ffbe0b; color: #1a1a2e;
  transform: rotate(3deg);
}

/* ===== GAME OVER ===== */
#gameOverScreen {
  justify-content: center;
  background: rgba(10,14,26,0.7);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}

.gameover-box {
  background: linear-gradient(180deg, #1a2744 0%, #0f1a30 100%);
  border: 3px solid rgba(100,200,255,0.2);
  border-radius: 24px;
  padding: 30px 40px;
  text-align: center;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  min-width: 260px;
}

.gameover-title {
  font-family: 'Bungee', cursive;
  font-size: 36px;
  color: #e63946;
  text-shadow: 0 3px 0 #a8202c;
  margin-bottom: 20px;
}

.gameover-scores {
  margin-bottom: 24px;
}
.gameover-scores .label {
  font-size: 14px;
  color: rgba(255,255,255,0.6);
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.gameover-scores .value {
  font-family: 'Bungee', cursive;
  font-size: 42px;
  color: #ffbe0b;
  text-shadow: 0 2px 8px rgba(255,190,11,0.3);
}
.gameover-scores .best-label {
  font-size: 13px;
  color: rgba(255,255,255,0.4);
  margin-top: 8px;
}
.gameover-scores .best-value {
  font-family: 'Bungee', cursive;
  font-size: 22px;
  color: #8338ec;
}
.new-best {
  color: #4cc764;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 2px;
  animation: pulse 0.6s ease-in-out infinite alternate;
}
@keyframes pulse { from { opacity: 0.7; } to { opacity: 1; } }

.gameover-btns {
  display: flex; gap: 12px; justify-content: center;
}
.btn-retry, .btn-menu {
  padding: 12px 28px;
  font-family: 'Bungee', cursive;
  font-size: 16px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  letter-spacing: 1px;
  transition: transform 0.1s;
}
.btn-retry {
  background: linear-gradient(180deg, #4cc764, #2d9e42);
  color: #fff;
  box-shadow: 0 4px 0 #1e7a30;
}
.btn-menu {
  background: linear-gradient(180deg, #5a6a8a, #3a4a6a);
  color: #fff;
  box-shadow: 0 4px 0 #2a3a5a;
}
.btn-retry:active, .btn-menu:active { transform: translateY(3px); }

/* ===== SCORE POPUP ===== */
.score-popup {
  position: absolute;
  font-family: 'Bungee', cursive;
  font-size: 32px;
  color: #ffbe0b;
  text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  pointer-events: none;
  z-index: 15;
  animation: scorePop 0.8s ease-out forwards;
}
@keyframes scorePop {
  0% { transform: translateY(0) scale(1.3); opacity: 1; }
  100% { transform: translateY(-60px) scale(0.8); opacity: 0; }
}
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-score">
      <div class="coin-icon">C</div>
      <span class="score-num" id="scoreDisplay">00</span>
    </div>
    <div class="logo-mini">
      <span class="tap">TAP</span>
      <span class="cap">CAP</span>
    </div>
    <button class="sound-btn" id="soundBtn" onclick="toggleSound()">
      <svg id="soundOn" viewBox="0 0 24 24" fill="none" stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      <svg id="soundOff" viewBox="0 0 24 24" fill="none" stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round" style="display:none"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
    </button>
  </div>

  <!-- MENU -->
  <div class="overlay" id="menuScreen">
    <div class="logo-container">
      <div class="logo-tapcap">
        <span class="tap">TAP</span>
        <span class="cap">CAP</span>
      </div>
      <div class="logo-creatures">CREATURES</div>
    </div>
    <div class="character-name" id="charName">ROBO KLAK</div>
    <div class="character-showcase">
      <canvas id="charPreview" width="200" height="220"></canvas>
      <div class="platform"></div>
    </div>
    <span class="char-nav left" onclick="prevChar()">&#x276E;</span>
    <span class="char-nav right" onclick="nextChar()">&#x276F;</span>
    <button class="start-btn" onclick="startGame()">START GAME</button>
  </div>

  <!-- READY -->
  <div class="overlay hidden" id="readyScreen">
    <div class="tap-icon">
      <svg viewBox="0 0 64 64" fill="none">
        <g>
          <circle cx="38" cy="14" r="4" fill="none" stroke="#fff" stroke-width="2" opacity="0.7"/>
          <circle cx="38" cy="14" r="2" fill="none" stroke="#fff" stroke-width="1" opacity="0.4"/>
          <path d="M32 24C32 24 28 28 28 34V48C28 50 30 52 32 52C34 52 36 50 36 48V34C36 28 32 24 32 24Z" fill="#fff"/>
          <path d="M32 34H40C42 34 44 36 44 38C44 40 42 42 40 42H36" fill="#fff"/>
          <path d="M36 38H42C44 38 46 40 46 42C46 44 44 46 42 46H36" fill="#fff"/>
          <path d="M36 42H40C42 42 44 44 44 46C44 48 42 50 40 50H32" fill="#fff"/>
        </g>
      </svg>
      <span class="tap-label">TAP!</span>
    </div>
    <div class="ready-text">TAP TO<br>START</div>
    <div class="ready-subtitle">AVOID THE OBSTACLES<br>TO SCORE POINTS!</div>
  </div>

  <!-- GAME OVER -->
  <div class="overlay hidden" id="gameOverScreen">
    <div class="gameover-box">
      <div class="gameover-title">GAME OVER</div>
      <div class="gameover-scores">
        <div class="label">SCORE</div>
        <div class="value" id="finalScore">0</div>
        <div class="best-label">BEST</div>
        <div class="best-value" id="bestScore">0</div>
        <div class="new-best hidden" id="newBestLabel">NEW BEST!</div>
      </div>
      <div class="gameover-btns">
        <button class="btn-retry" onclick="retryGame()">RETRY</button>
        <button class="btn-menu" onclick="goToMenu()">MENU</button>
      </div>
    </div>
  </div>
</div>

<script>
// ===== GAME ENGINE =====
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('gameContainer');

let W, H, scale;
const BASE_W = 480;
const BASE_H = 854;

function resize() {
  const rect = container.getBoundingClientRect();
  canvas.width = rect.width * window.devicePixelRatio;
  canvas.height = rect.height * window.devicePixelRatio;
  W = canvas.width;
  H = canvas.height;
  scale = W / BASE_W;
  ctx.imageSmoothingEnabled = true;
}
resize();
window.addEventListener('resize', resize);

// ===== CHARACTERS =====
const CHARACTERS = [
  {
    name: "ROBO KLAK",
    head: { fill: "#b0b8c8", outline: "#7a8898", spots: ["#8a9aaa","#6a7a8a"], eyeColor: "#ff3", pupil: "#f00", mouth: "#444" },
    body: { fill: "#5a6a8a", outline: "#3a4a6a", accent: "#7a8aaa", detail: "#4a5a7a" },
    legs: { fill: "#6a7a6a", outline: "#4a5a4a", accent: "#5a6a5a", shoes: "#8a8a6a" }
  },
  {
    name: "BLAZE FURY",
    head: { fill: "#e8834a", outline: "#c0602a", spots: ["#d06030","#b04820"], eyeColor: "#ff0", pupil: "#a00", mouth: "#d22" },
    body: { fill: "#8a2a1a", outline: "#6a1a0a", accent: "#aa3a2a", detail: "#7a2010" },
    legs: { fill: "#4a3a2a", outline: "#2a1a0a", accent: "#5a4a3a", shoes: "#e8834a" }
  },
  {
    name: "FROST BYTE",
    head: { fill: "#a8d8ea", outline: "#6aaace", spots: ["#7abcda","#5a9aba"], eyeColor: "#fff", pupil: "#2af", mouth: "#6ae" },
    body: { fill: "#2a4a7a", outline: "#1a2a5a", accent: "#3a5a9a", detail: "#1a3a6a" },
    legs: { fill: "#3a3a5a", outline: "#1a1a3a", accent: "#4a4a6a", shoes: "#a8d8ea" }
  },
  {
    name: "TOXIC DRIP",
    head: { fill: "#b8e84a", outline: "#8aba2a", spots: ["#90c030","#78a020"], eyeColor: "#ff0", pupil: "#080", mouth: "#6a2" },
    body: { fill: "#2a3a1a", outline: "#1a2a0a", accent: "#3a4a2a", detail: "#2a3510" },
    legs: { fill: "#3a2a3a", outline: "#1a0a1a", accent: "#4a3a4a", shoes: "#b8e84a" }
  },
  {
    name: "SHADOW SPEC",
    head: { fill: "#5a4a6a", outline: "#3a2a4a", spots: ["#4a3a5a","#3a2a4a"], eyeColor: "#c8f", pupil: "#408", mouth: "#83c" },
    body: { fill: "#1a1a2a", outline: "#0a0a1a", accent: "#2a2a3a", detail: "#15152a" },
    legs: { fill: "#2a1a2a", outline: "#0a0010", accent: "#3a2a3a", shoes: "#8a5aaa" }
  }
];

let currentChar = 0;
let soundEnabled = true;

// ===== AUDIO (Web Audio API) =====
let audioCtx;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playSound(type) {
  if (!soundEnabled) return;
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    const t = ctx.currentTime;
    
    if (type === 'flap') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, t);
      osc.frequency.exponentialRampToValueAtTime(600, t + 0.08);
      gain.gain.setValueAtTime(0.15, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
      osc.start(t);
      osc.stop(t + 0.12);
    } else if (type === 'score') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523, t);
      osc.frequency.setValueAtTime(659, t + 0.08);
      osc.frequency.setValueAtTime(784, t + 0.16);
      gain.gain.setValueAtTime(0.15, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      osc.start(t);
      osc.stop(t + 0.3);
    } else if (type === 'hit') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(200, t);
      osc.frequency.exponentialRampToValueAtTime(50, t + 0.3);
      gain.gain.setValueAtTime(0.2, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      osc.start(t);
      osc.stop(t + 0.3);
    } else if (type === 'select') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, t);
      osc.frequency.exponentialRampToValueAtTime(550, t + 0.06);
      gain.gain.setValueAtTime(0.1, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
      osc.start(t);
      osc.stop(t + 0.1);
    }
  } catch(e) {}
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  document.getElementById('soundOn').style.display = soundEnabled ? '' : 'none';
  document.getElementById('soundOff').style.display = soundEnabled ? 'none' : '';
}

// ===== DRAW CHARACTER =====
function drawKeycapChar(ctx, x, y, s, char, angle, side) {
  ctx.save();
  ctx.translate(x, y);
  if (angle) ctx.rotate(angle);
  
  const kw = 50 * s;
  const kh = 38 * s;
  const gap = 4 * s;
  const r = 6 * s;
  const c = char;
  
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  roundRect(ctx, -kw/2 + 4*s, -kh*0.3 + 4*s, kw, kh, r);
  ctx.fill();
  
  // Bottom keycap (upside down - legs)
  const legY = kh + gap * 2;
  ctx.save();
  ctx.translate(0, legY);
  ctx.scale(1, -1);
  drawKeycap(ctx, -kw/2, -kh/2, kw, kh, r, c.legs.fill, c.legs.outline, c.legs.accent);
  ctx.restore();
  
  // Shoes/feet
  const shoeW = 14 * s;
  const shoeH = 8 * s;
  ctx.fillStyle = c.legs.shoes;
  roundRectFill(ctx, -kw/2 - 2*s, legY + kh/2 - 2*s, shoeW, shoeH, 3*s);
  roundRectFill(ctx, kw/2 - shoeW + 2*s, legY + kh/2 - 2*s, shoeW, shoeH, 3*s);
  
  // Belt/connector sparkle
  const beltY = kh * 0.5 + gap;
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 1.5 * s;
  for (let i = -1; i <= 1; i += 2) {
    ctx.beginPath();
    ctx.moveTo(i * 6 * s, beltY - 3 * s);
    ctx.lineTo(i * 10 * s, beltY);
    ctx.lineTo(i * 6 * s, beltY + 3 * s);
    ctx.stroke();
  }
  
  // Body keycap (middle)
  drawKeycap(ctx, -kw/2, 0, kw, kh, r, c.body.fill, c.body.outline, c.body.accent);
  // Body detail
  ctx.fillStyle = c.body.detail;
  roundRectFill(ctx, -kw/4, kh*0.15, kw/2, kh*0.4, 3*s);
  
  // Head keycap (top)
  const headY = -(kh + gap);
  const headW = kw * 1.1;
  const headH = kh * 1.05;
  drawKeycap(ctx, -headW/2, headY, headW, headH, r * 1.1, c.head.fill, c.head.outline, null);
  
  // Face spots
  c.head.spots.forEach((col, i) => {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(-headW * 0.2 + i * headW * 0.35, headY + headH * 0.55, 4 * s, 0, Math.PI * 2);
    ctx.fill();
  });
  
  // Eyes
  const eyeY = headY + headH * 0.38;
  const eyeSpacing = headW * 0.22;
  const eyeW = 12 * s;
  const eyeH = 14 * s;
  [-1, 1].forEach(dir => {
    ctx.fillStyle = c.head.eyeColor;
    roundRectFill(ctx, dir * eyeSpacing - eyeW/2, eyeY - eyeH/2, eyeW, eyeH, 3*s);
    ctx.fillStyle = c.head.pupil;
    ctx.beginPath();
    ctx.arc(dir * eyeSpacing + (side ? 3.5*s : 0), eyeY + 1*s, 3.5*s, 0, Math.PI*2);
    ctx.fill();
  });
  
  // Mouth
  ctx.fillStyle = c.head.mouth;
  ctx.beginPath();
  if (c.name.includes('ROBO')) {
    roundRectFill(ctx, -6*s, headY + headH*0.68, 12*s, 4*s, 1*s);
  } else {
    ctx.arc(0, headY + headH * 0.72, 5*s, 0, Math.PI);
    ctx.fill();
  }
  
  // Hair / top detail
  if (c.name.includes('BLAZE')) {
    drawHair(ctx, 0, headY - 2*s, headW, s, '#ff6030', 'flame');
  } else if (c.name.includes('FROST')) {
    drawHair(ctx, 0, headY - 2*s, headW, s, '#d0f0ff', 'crystal');
  } else if (c.name.includes('ROBO')) {
    ctx.fillStyle = '#8a9aaa';
    ctx.fillRect(-4*s, headY - 8*s, 8*s, 8*s);
    ctx.fillStyle = '#f00';
    ctx.beginPath();
    ctx.arc(0, headY - 8*s, 3*s, 0, Math.PI*2);
    ctx.fill();
  } else if (c.name.includes('TOXIC')) {
    drawHair(ctx, 0, headY - 2*s, headW, s, '#90e020', 'spiky');
  } else if (c.name.includes('SHADOW')) {
    drawHair(ctx, 0, headY - 2*s, headW, s, '#8a5aaa', 'hood');
  }
  
  ctx.restore();
}

function drawHair(ctx, x, y, w, s, color, type) {
  ctx.fillStyle = color;
  if (type === 'messy') {
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.ellipse(x + i * 7 * s, y - 4 * s, 8 * s, (10 + Math.abs(i) * 3) * s, i * 0.2, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (type === 'flame') {
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(x + i * 8 * s - 5 * s, y + 2 * s);
      ctx.quadraticCurveTo(x + i * 8 * s, y - (18 + Math.random() * 8) * s, x + i * 8 * s + 5 * s, y + 2 * s);
      ctx.fill();
    }
  } else if (type === 'crystal') {
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(x + i * 8 * s, y - 14 * s);
      ctx.lineTo(x + i * 8 * s - 5 * s, y + 2 * s);
      ctx.lineTo(x + i * 8 * s + 5 * s, y + 2 * s);
      ctx.closePath();
      ctx.fill();
    }
  } else if (type === 'spiky') {
    for (let i = -3; i <= 3; i++) {
      ctx.beginPath();
      ctx.moveTo(x + i * 6 * s, y + 2 * s);
      ctx.lineTo(x + i * 6 * s + 2 * s, y - 16 * s);
      ctx.lineTo(x + i * 6 * s + 5 * s, y + 2 * s);
      ctx.fill();
    }
  } else if (type === 'hood') {
    ctx.beginPath();
    ctx.moveTo(x - w * 0.5, y + 5 * s);
    ctx.quadraticCurveTo(x, y - 18 * s, x + w * 0.5, y + 5 * s);
    ctx.fill();
  }
}

function drawKeycap(ctx, x, y, w, h, r, fill, outline, accent) {
  // Main shape
  ctx.fillStyle = fill;
  ctx.strokeStyle = outline;
  ctx.lineWidth = 2 * (w / 50);
  ctx.beginPath();
  roundRect(ctx, x, y, w, h, r);
  ctx.fill();
  ctx.stroke();
  
  // Top face highlight
  if (accent) {
    ctx.fillStyle = accent;
    ctx.beginPath();
    roundRect(ctx, x + w*0.1, y + h*0.1, w*0.8, h*0.35, r*0.6);
    ctx.fill();
  }
  
  // Shine
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.beginPath();
  roundRect(ctx, x + w*0.1, y + h*0.08, w*0.5, h*0.25, r*0.5);
  ctx.fill();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function roundRectFill(ctx, x, y, w, h, r) {
  ctx.beginPath();
  roundRect(ctx, x, y, w, h, r);
  ctx.fill();
}

// ===== BACKGROUND =====
function drawCaveBackground(scrollX) {
  // Deep gradient
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0a1628');
  grad.addColorStop(0.4, '#0f2040');
  grad.addColorStop(0.7, '#0a1830');
  grad.addColorStop(1, '#061020');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  
  // Light rays
  ctx.save();
  ctx.globalAlpha = 0.04;
  for (let i = 0; i < 5; i++) {
    const rx = W * 0.3 + i * W * 0.12;
    ctx.fillStyle = '#4ac8ff';
    ctx.beginPath();
    ctx.moveTo(rx - 10*scale, 0);
    ctx.lineTo(rx + 30*scale, 0);
    ctx.lineTo(rx + 80*scale + Math.sin(scrollX * 0.001 + i) * 20 * scale, H);
    ctx.lineTo(rx - 40*scale + Math.sin(scrollX * 0.001 + i) * 20 * scale, H);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
  
  // Stalactites (top)
  drawStalactites(scrollX);
  
  // Far background pillars
  ctx.save();
  ctx.globalAlpha = 0.15;
  for (let i = 0; i < 6; i++) {
    const px = ((i * W * 0.25) - (scrollX * 0.15) % (W * 0.25) + W * 0.25) % (W * 1.5) - W * 0.1;
    ctx.fillStyle = '#1a3050';
    ctx.beginPath();
    ctx.moveTo(px, H);
    ctx.lineTo(px + 20*scale, H * 0.15);
    ctx.quadraticCurveTo(px + 40*scale, H * 0.05, px + 60*scale, H * 0.2);
    ctx.lineTo(px + 80*scale, H);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
  
  // Mid background shapes
  ctx.save();
  ctx.globalAlpha = 0.12;
  for (let i = 0; i < 8; i++) {
    const px = ((i * W * 0.2) - (scrollX * 0.3) % (W * 0.2) + W * 0.2) % (W * 1.6) - W * 0.1;
    ctx.fillStyle = '#152a44';
    ctx.fillRect(px, H * 0.6, 30 * scale, H * 0.4);
    ctx.fillRect(px + 5*scale, H * 0.5, 20 * scale, H * 0.1);
  }
  ctx.restore();
  
  // Ground
  const groundY = H * 0.88;
  const gGrad = ctx.createLinearGradient(0, groundY, 0, H);
  gGrad.addColorStop(0, '#0f2844');
  gGrad.addColorStop(0.3, '#0a1e38');
  gGrad.addColorStop(1, '#06142a');
  ctx.fillStyle = gGrad;
  ctx.fillRect(0, groundY, W, H - groundY);
  
  // Ground line glow
  ctx.strokeStyle = '#1a5a8a';
  ctx.lineWidth = 2 * scale;
  ctx.globalAlpha = 0.3;
  ctx.beginPath();
  ctx.moveTo(0, groundY);
  ctx.lineTo(W, groundY);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawStalactites(scrollX) {
  ctx.save();
  ctx.globalAlpha = 0.2;
  for (let i = 0; i < 12; i++) {
    const sx = ((i * W * 0.12) - (scrollX * 0.2) % (W * 0.12) + W * 0.12) % (W * 1.5) - W * 0.05;
    const sh = (30 + (i * 17) % 50) * scale;
    ctx.fillStyle = '#1a2a44';
    ctx.beginPath();
    ctx.moveTo(sx - 8*scale, 0);
    ctx.lineTo(sx + 8*scale, 0);
    ctx.lineTo(sx + 2*scale, sh);
    ctx.lineTo(sx - 2*scale, sh);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

// ===== OBSTACLES (Keycap stacks) =====
function drawObstacle(x, gapY, gapH) {
  const ow = 70 * scale;
  const kh = 50 * scale;
  const r = 8 * scale;
  const topColor = '#1a2a44';
  const topHighlight = '#2a3a5a';
  const topOutline = '#0f1a2e';
  
  // Top stack (going up from gap)
  let ty = gapY - kh;
  while (ty + kh > -kh) {
    drawObstacleKeycap(x - ow/2, ty, ow, kh, r, topColor, topOutline, topHighlight);
    ty -= kh + 4 * scale;
  }
  
  // Bottom stack (going down from gap)
  let by = gapY + gapH;
  while (by < H) {
    drawObstacleKeycap(x - ow/2, by, ow, kh, r, topColor, topOutline, topHighlight);
    by += kh + 4 * scale;
  }
  
  // Green glow at gap edges
  ctx.save();
  ctx.globalAlpha = 0.3;
  const glowGrad = ctx.createRadialGradient(x, gapY + gapH/2, 0, x, gapY + gapH/2, gapH);
  glowGrad.addColorStop(0, '#2aff4a');
  glowGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = glowGrad;
  ctx.fillRect(x - ow, gapY - 10*scale, ow*2, gapH + 20*scale);
  ctx.restore();
}

function drawObstacleKeycap(x, y, w, h, r, fill, outline, highlight) {
  ctx.fillStyle = fill;
  ctx.strokeStyle = outline;
  ctx.lineWidth = 2 * scale;
  ctx.beginPath();
  roundRect(ctx, x, y, w, h, r);
  ctx.fill();
  ctx.stroke();
  
  // Top face
  ctx.fillStyle = highlight;
  ctx.beginPath();
  roundRect(ctx, x + w*0.08, y + h*0.1, w*0.84, h*0.35, r*0.5);
  ctx.fill();
  
  // Shine
  ctx.fillStyle = 'rgba(255,255,255,0.04)';
  ctx.beginPath();
  roundRect(ctx, x + w*0.1, y + h*0.08, w*0.4, h*0.2, r*0.3);
  ctx.fill();
}

// ===== PARTICLES =====
class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 4 * scale;
    this.vy = (Math.random() - 0.5) * 4 * scale;
    this.life = 1;
    this.decay = 0.02 + Math.random() * 0.02;
    this.size = (2 + Math.random() * 3) * scale;
    this.color = color;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
  }
  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
    ctx.globalAlpha = 1;
  }
}

// ===== GAME STATE =====
let gameState = 'menu'; // menu, ready, playing, dead
let player = { x: 0, y: 0, vy: 0, angle: 0 };
let obstacles = [];
let particles = [];
let score = 0;
let bestScoreVal = 0;
let scrollX = 0;
let gameSpeed = 1.5;
let obstacleTimer = 0;
let flashTimer = 0;
let groundY = 0;
let menuBobT = 0;
let charPreviewCtx = document.getElementById('charPreview').getContext('2d');

// Try load best score
try { bestScoreVal = parseInt(localStorage.getItem('tapcap_best') || '0') || 0; } catch(e) {}

const GRAVITY = 0.22;
const FLAP_FORCE = -7.0;
const GAP_HEIGHT = 300;
const OBSTACLE_SPACING = 320;
const CHAR_SIZE = 1.0;
const PLAYER_X_POS = 0.22;

// ===== CHARACTER PREVIEW =====
function drawCharPreview() {
  const pc = document.getElementById('charPreview');
  const pw = pc.width = 200;
  const ph = pc.height = 220;
  charPreviewCtx.clearRect(0, 0, pw, ph);
  drawKeycapChar(charPreviewCtx, pw/2, ph/2 + 10, 1.8, CHARACTERS[currentChar], 0, false);
}

function prevChar() {
  playSound('select');
  currentChar = (currentChar - 1 + CHARACTERS.length) % CHARACTERS.length;
  document.getElementById('charName').textContent = CHARACTERS[currentChar].name;
  drawCharPreview();
}
function nextChar() {
  playSound('select');
  currentChar = (currentChar + 1) % CHARACTERS.length;
  document.getElementById('charName').textContent = CHARACTERS[currentChar].name;
  drawCharPreview();
}

// ===== GAME FUNCTIONS =====
function startGame() {
  playSound('flap');
  gameState = 'ready';
  show('readyScreen');
  hide('menuScreen');
  document.getElementById('hud').classList.remove('hidden');
  score = 0;
  updateScoreDisplay();
  resetPlayer();
  obstacles = [];
  particles = [];
  scrollX = 0;
  obstacleTimer = 0;
  gameSpeed = 1.5;
}

function resetPlayer() {
  groundY = H * 0.88;
  player.x = W * PLAYER_X_POS;
  player.y = H * 0.42;
  player.vy = 0;
  player.angle = 0;
}

function flap() {
  if (gameState === 'ready') {
    gameState = 'playing';
    hide('readyScreen');
  }
  if (gameState === 'playing') {
    player.vy = FLAP_FORCE * scale;
    playSound('flap');
    // Flap particles
    for (let i = 0; i < 5; i++) {
      particles.push(new Particle(player.x, player.y + 20*scale, 'rgba(255,255,255,0.6)'));
    }
  }
}

function die() {
  if (gameState !== 'playing') return;
  gameState = 'dead';
  playSound('hit');
  flashTimer = 15;
  
  // Death particles
  const c = CHARACTERS[currentChar];
  for (let i = 0; i < 20; i++) {
    particles.push(new Particle(player.x, player.y, c.head.fill));
    particles.push(new Particle(player.x, player.y, c.body.fill));
  }
  
  // Check best
  let isNewBest = false;
  if (score > bestScoreVal) {
    bestScoreVal = score;
    isNewBest = true;
    try { localStorage.setItem('tapcap_best', bestScoreVal.toString()); } catch(e) {}
  }
  
  setTimeout(() => {
    document.getElementById('finalScore').textContent = score;
    document.getElementById('bestScore').textContent = bestScoreVal;
    const nbl = document.getElementById('newBestLabel');
    if (isNewBest && score > 0) {
      nbl.classList.remove('hidden');
    } else {
      nbl.classList.add('hidden');
    }
    show('gameOverScreen');
  }, 600);
}

function retryGame() {
  playSound('select');
  hide('gameOverScreen');
  score = 0;
  updateScoreDisplay();
  resetPlayer();
  obstacles = [];
  particles = [];
  scrollX = 0;
  obstacleTimer = 0;
  gameSpeed = 1.5;
  gameState = 'ready';
  show('readyScreen');
}

function goToMenu() {
  playSound('select');
  hide('gameOverScreen');
  document.getElementById('hud').classList.add('hidden');
  gameState = 'menu';
  show('menuScreen');
  drawCharPreview();
}

function updateScoreDisplay() {
  document.getElementById('scoreDisplay').textContent = score.toString().padStart(2, '0');
}

function show(id) { document.getElementById(id).classList.remove('hidden'); }
function hide(id) { document.getElementById(id).classList.add('hidden'); }

// ===== SCORE POPUP =====
function showScorePopup() {
  const popup = document.createElement('div');
  popup.className = 'score-popup';
  popup.textContent = '+1';
  popup.style.left = (player.x / W * 100) + '%';
  popup.style.top = (player.y / H * 100 - 5) + '%';
  container.appendChild(popup);
  setTimeout(() => popup.remove(), 800);
}

// ===== INPUT =====
container.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (gameState === 'ready' || gameState === 'playing') {
    flap();
  }
});
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    if (gameState === 'ready' || gameState === 'playing') flap();
  }
});

// ===== MAIN LOOP =====
function update() {
  const spd = gameSpeed * scale;
  
  if (gameState === 'playing') {
    scrollX += spd;
    
    // Gravity
    player.vy += GRAVITY * scale;
    player.y += player.vy;
    
    // Rotation
    if (player.vy < 0) {
      player.angle = Math.max(-0.25, player.angle - 0.04);
    } else {
      player.angle = Math.min(0.6, player.angle + 0.02);
    }
    
    // Speed increase
    gameSpeed = 1.5 + score * 0.012;
    if (gameSpeed > 4) gameSpeed = 4;
    
    // Obstacles
    obstacleTimer += spd;
    if (obstacleTimer > OBSTACLE_SPACING * scale) {
      obstacleTimer = 0;
      const minGapY = H * 0.1;
      const maxGapY = H * 0.52;
      const gapY = minGapY + Math.random() * (maxGapY - minGapY);
      const gapH = GAP_HEIGHT * scale;
      obstacles.push({ x: W + 40 * scale, gapY, gapH, scored: false });
    }
    
    // Move & score obstacles
    for (let i = obstacles.length - 1; i >= 0; i--) {
      obstacles[i].x -= spd;
      
      // Score
      if (!obstacles[i].scored && obstacles[i].x + 35*scale < player.x) {
        obstacles[i].scored = true;
        score++;
        updateScoreDisplay();
        playSound('score');
        showScorePopup();
      }
      
      // Remove off screen
      if (obstacles[i].x < -80 * scale) {
        obstacles.splice(i, 1);
      }
    }
    
    // Collision (forgiving hitbox)
    const charHalfW = 18 * scale * CHAR_SIZE;
    const charHalfH = 35 * scale * CHAR_SIZE;
    
    // Ground/ceiling
    if (player.y + charHalfH > groundY || player.y - charHalfH < 0) {
      die();
    }
    
    // Obstacle collision
    for (const obs of obstacles) {
      const ow = 35 * scale;
      if (player.x + charHalfW > obs.x - ow && player.x - charHalfW < obs.x + ow) {
        if (player.y - charHalfH < obs.gapY || player.y + charHalfH > obs.gapY + obs.gapH) {
          die();
        }
      }
    }
  }
  
  if (gameState === 'ready') {
    scrollX += 0.5 * scale;
    menuBobT += 0.05;
    player.y = H * 0.42 + Math.sin(menuBobT) * 8 * scale;
  }
  
  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    if (particles[i].life <= 0) particles.splice(i, 1);
  }
  
  if (flashTimer > 0) flashTimer--;
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  
  drawCaveBackground(scrollX);
  
  if (gameState === 'menu') {
    // Just the background for menu
    return;
  }
  
  // Obstacles
  for (const obs of obstacles) {
    drawObstacle(obs.x, obs.gapY, obs.gapH);
  }
  
  // Player
  if (gameState !== 'menu') {
    ctx.save();
    const charScale = CHAR_SIZE * scale * 0.8;
    drawKeycapChar(ctx, player.x, player.y, charScale, CHARACTERS[currentChar], player.angle, true);
    ctx.restore();
  }
  
  // Particles
  for (const p of particles) {
    p.draw(ctx);
  }
  
  // Flash on death
  if (flashTimer > 0) {
    ctx.fillStyle = `rgba(255,255,255,${flashTimer / 15 * 0.4})`;
    ctx.fillRect(0, 0, W, H);
  }
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// ===== INIT =====
drawCharPreview();
gameLoop();
</script>
</body>
