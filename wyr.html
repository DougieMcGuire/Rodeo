<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Would You Rather - RODEO</title>
<link rel="icon" href="assets/favicon.png">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: radial-gradient(circle at center, #ff0000 0%, #8b0000 100%);
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
}

/* Animated radial lines effect */
body::before {
    content: '';
    position: fixed;
    top: 50%;
    left: 50%;
    width: 200vmax;
    height: 200vmax;
    transform: translate(-50%, -50%);
    background: repeating-conic-gradient(
        from 0deg,
        transparent 0deg,
        transparent 2deg,
        rgba(0, 0, 0, 0.15) 2deg,
        rgba(0, 0, 0, 0.15) 4deg
    );
    pointer-events: none;
    z-index: 0;
}

.app {
    width: 100%;
    max-width: 600px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 25px;
    padding: 20px;
    position: relative;
    z-index: 1;
}

/* Loading */
.loading-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
}

.spinner-container {
    position: relative;
    width: 60px;
    height: 60px;
}

.spinner {
    width: 60px;
    height: 60px;
    border: 8px solid rgba(255, 255, 255, 0.3);
    border-top: 8px solid white;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

.spinner-icon {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 30px;
    height: 30px;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.loading-text {
    color: white;
    font-size: 1.5rem;
    font-weight: 800;
    text-transform: uppercase;
    text-shadow: 3px 3px 0 #000;
}

/* Game Title */
.game-title {
    font-size: 2.5rem;
    color: white;
    text-shadow: 4px 4px 0 #000;
    text-transform: uppercase;
    text-align: center;
    letter-spacing: 2px;
    margin-bottom: 10px;
}

/* Question Box */
.question-box {
    background: white;
    padding: 30px;
    border: 5px solid #000;
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    text-align: center;
    width: 100%;
}

.question-text {
    font-size: 1.8rem;
    font-weight: 800;
    margin-bottom: 10px;
    text-transform: uppercase;
    color: #ff0000;
}

.round-counter {
    font-size: 0.9rem;
    color: #666;
    font-weight: 700;
    text-transform: uppercase;
}

/* Choice Container */
.choice-container {
    display: flex;
    flex-direction: column;
    gap: 20px;
    width: 100%;
}

.choice-box {
    background: white;
    padding: 30px 20px;
    border: 5px solid #000;
    border-radius: 15px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 6px 0 #000;
    font-size: 1.2rem;
    font-weight: 700;
    text-align: center;
    position: relative;
}

.choice-box:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 0 #000;
}

.choice-box:active {
    transform: translateY(2px);
    box-shadow: 0 4px 0 #000;
}

.choice-box.selected {
    background: #FFD700;
    transform: scale(1.02);
}

.choice-box.option-a.selected {
    background: linear-gradient(180deg, #90EE90 0%, #7FD87F 100%);
}

.choice-box.option-b.selected {
    background: linear-gradient(180deg, #FFB6C1 0%, #FFB6C1 100%);
}

/* Waiting Message */
.waiting-box {
    background: white;
    padding: 30px;
    border: 5px solid #000;
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    text-align: center;
    width: 100%;
}

.waiting-text {
    font-size: 1.5rem;
    font-weight: 800;
    margin-bottom: 20px;
    text-transform: uppercase;
}

.voters-list {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
}

.voter-dot {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 12px;
    background: #f0f0f0;
    border: 4px solid #000;
}

.voter-dot.voted {
    background: #90EE90;
}

.voter-dot img {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 3px solid #000;
    object-fit: cover;
}

.voter-dot .voter-name {
    font-size: 0.9rem;
    font-weight: 800;
    color: #333;
}

/* Results */
.results-box {
    background: white;
    padding: 30px;
    border: 5px solid #000;
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    width: 100%;
}

.results-title {
    font-size: 1.8rem;
    font-weight: 900;
    margin-bottom: 20px;
    text-transform: uppercase;
    text-align: center;
}

.result-option {
    margin-bottom: 20px;
    padding: 20px;
    border: 4px solid #000;
    border-radius: 12px;
    background: #f9f9f9;
}

.result-option.winner {
    background: linear-gradient(180deg, #FFD700 0%, #FFA500 100%);
}

.result-option-text {
    font-size: 1.2rem;
    font-weight: 800;
    margin-bottom: 10px;
}

.result-percentage {
    font-size: 2rem;
    font-weight: 900;
    color: #ff0000;
    margin-bottom: 10px;
}

.result-voters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 15px;
}

.result-voter {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 8px;
    background: white;
    border: 3px solid #000;
    font-size: 0.85rem;
    font-weight: 700;
}

.result-voter img {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid #000;
    object-fit: cover;
}

.exposed-banner {
    background: #ff0000;
    color: white;
    padding: 15px;
    border: 4px solid #000;
    border-radius: 12px;
    text-align: center;
    font-size: 1.5rem;
    font-weight: 900;
    text-transform: uppercase;
    margin-bottom: 20px;
    box-shadow: 0 6px 0 #000;
}

/* Buttons */
.btn {
    padding: 20px 40px;
    border: 5px solid #000;
    border-radius: 15px;
    font-size: 1.2rem;
    font-weight: 900;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 2px;
    box-shadow: 0 6px 0 #000, 0 6px 15px rgba(0, 0, 0, 0.3);
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 200, 200, 0.95) 100%);
    width: 100%;
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 0 #000, 0 8px 20px rgba(0, 0, 0, 0.4);
}

.btn:active {
    transform: translateY(2px);
    box-shadow: 0 4px 0 #000, 0 4px 10px rgba(0, 0, 0, 0.3);
}

.btn-primary {
    background: linear-gradient(180deg, rgba(255, 182, 193, 0.95) 0%, rgba(255, 105, 180, 0.95) 100%);
}

.btn-danger {
    background: linear-gradient(180deg, #ff6b6b 0%, #ee5a6f 100%);
    color: white;
}

.button-group {
    display: flex;
    flex-direction: column;
    gap: 15px;
    width: 100%;
}

/* Host Controls */
.host-controls {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 100;
}

.host-controls .btn {
    padding: 12px 24px;
    font-size: 0.9rem;
    width: auto;
}

/* Responsive */
@media (max-width: 600px) {
    .game-title {
        font-size: 2rem;
    }

    .question-text {
        font-size: 1.4rem;
    }

    .choice-box {
        font-size: 1rem;
        padding: 25px 15px;
    }

    .result-option-text {
        font-size: 1rem;
    }

    .result-percentage {
        font-size: 1.5rem;
    }

    .host-controls {
        bottom: 10px;
        right: 10px;
    }
}

.hidden {
    display: none !important;
}
</style>
</head>
<body>

<div class="app" id="app"></div>

<div class="host-controls hidden" id="hostControls">
    <button class="btn btn-danger" onclick="endGame()">End Game</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
// ─── Firebase ───
const firebaseConfig = {
    apiKey: "AIzaSyBaJXCqGmUaGumvcWNE7w4FOOzTJVDH-yg",
    authDomain: "polorfriends.firebaseapp.com",
    databaseURL: "https://polorfriends-default-rtdb.firebaseio.com",
    projectId: "polorfriends",
    storageBucket: "polorfriends.firebasestorage.app",
    messagingSenderId: "328546525972",
    appId: "1:328546525972:web:a6fe0f0a45b4565a7b1801",
    measurementId: "G-07B4713DQQ"
};
firebase.initializeApp(firebaseConfig);
const database = firebase.database();

// ─── Scenarios Data ───
const SCENARIOS = {
    family: [
        ["Have unlimited pizza for life", "Have unlimited tacos for life"],
        ["Be able to fly", "Be invisible"],
        ["Live in a treehouse", "Live in a castle"],
        ["Have a pet dragon", "Have a pet unicorn"],
        ["Always be 10 minutes late", "Always be 20 minutes early"],
        ["Spend a week with {player} at Disney World", "Spend a week with {player} at the beach"],
        ["Never eat dessert again", "Never eat pizza again"],
        ["Be able to talk to animals", "Be able to speak every language"],
        ["Have super strength", "Have super speed"],
        ["Live without music", "Live without TV"],
        ["Always have to sing instead of speak", "Always have to dance instead of walk"],
        ["Be the funniest person alive", "Be the smartest person alive"],
        ["Have a rewind button for life", "Have a pause button for life"],
        ["Never use social media again", "Never watch another movie/show again"],
        ["Go on a road trip with {player}", "Go camping with {player}"]
    ],
    friends: [
        ["Kiss {player}", "Go on a date with {player}"],
        ["Never have your phone die", "Never have slow wifi"],
        ["Be TikTok famous", "Be Instagram famous"],
        ["Fight one horse-sized duck", "Fight 100 duck-sized horses"],
        ["Share a secret with {player}", "Share your phone password with {player}"],
        ["Always know what {player} is thinking", "Always know when {player} is lying"],
        ["Lose all your photos", "Lose all your money"],
        ["Never drink coffee again", "Never drink alcohol again"],
        ["Live with {player} for a year", "Be roommates with {player} for a month"],
        ["Have everyone at the party follow you on Instagram", "Get free drinks all night"],
        ["Only eat chicken nuggets", "Only eat french fries"],
        ["Win $10,000 but {player} knows your bank password", "Win $5,000 and keep it secret"],
        ["Always be the designated driver", "Always need a ride home"],
        ["Hear {player} sing karaoke for an hour", "Watch {player} attempt standup comedy"],
        ["Never go to parties again", "Never have a quiet night in again"]
    ],
    freaky: [
        ["Sleep with {player}", "Sleep with {player}'s best friend"],
        ["Send a nude to the group chat", "Post your search history publicly"],
        ["Make out with {player} right now", "Give {player} a lap dance"],
        ["Be handcuffed to {player} for 24 hours", "Be in a room alone with {player} for 6 hours"],
        ["Have everyone know your body count", "Have everyone see your text messages"],
        ["Drunk text your ex", "Drunk call your crush"],
        ["Have a threesome with {player} and {player}", "Have a threesome with two strangers"],
        ["Never have sex again", "Never masturbate again"],
        ["Hook up with {player} in front of everyone", "Hook up with {player} in secret but everyone finds out"],
        ["Let {player} go through your phone", "Let {player} read your diary"],
        ["Send your nudes to {player}", "Receive {player}'s nudes"],
        ["Be dominated by {player}", "Dominate {player}"],
        ["Have sex in public once", "Never have sex with lights on again"],
        ["Make out with everyone in this room", "Never kiss anyone again for a year"],
        ["Try every kink once", "Stick to vanilla forever"]
    ],
    party: [
        ["Take 5 shots right now", "Shotgun 3 beers right now"],
        ["Streak around the block", "Flash the group"],
        ["Play truth or dare with {player} for an hour", "Play never have I ever for an hour"],
        ["Drink every time {player} drinks tonight", "Do a body shot off {player}"],
        ["Beer bong 2 beers", "Take 10 shots in 10 minutes"],
        ["Fight {player}", "Kiss {player}"],
        ["Chug mystery drink", "Drink from {player}'s drink all night"],
        ["Do karaoke drunk", "Dance on a table"],
        ["Let {player} draw on your face", "Let the group choose your outfit tomorrow"],
        ["Lose a drinking game and streak", "Win a drinking game and take 3 shots"],
        ["Take a shot every 10 minutes for an hour", "Shotgun a beer every 30 minutes for 2 hours"],
        ["Make out with {player} for 30 seconds", "Give {player} a piggyback ride around the party"],
        ["Compete in a chugging contest with {player}", "Play flip cup with {player} as your partner"],
        ["Start a dance circle", "Start a mosh pit"],
        ["Drink whatever {player} mixes for you", "Let {player} feed you mystery shots"]
    ]
};

// ─── Utils ───
function getPlayerData() {
    const d = localStorage.getItem('playerData');
    return d ? JSON.parse(d) : null;
}
function getCurrentRoom() { return localStorage.getItem('currentRoom'); }
function clearCurrentRoom() { localStorage.removeItem('currentRoom'); }

// ─── State ───
const urlParams = new URLSearchParams(window.location.search);
const roomCode = urlParams.get('room') || getCurrentRoom();
const playerData = getPlayerData();
if (!roomCode || !playerData) window.location.href = 'index.html';

let players = [];
let isHost = false;
let currentMode = 'friends'; // default mode
let usedScenarios = [];
let roundNumber = 1;

const app = document.getElementById('app');

function showLoading() {
    app.innerHTML = `
        <div class="loading-screen">
            <div class="spinner-container">
                <div class="spinner"></div>
                <img src="assets/favicon.png" class="spinner-icon" alt="">
            </div>
            <div class="loading-text">Loading game...</div>
        </div>
    `;
}

showLoading();

// ─── Initialize ───
database.ref('rooms/' + roomCode).once('value', snap => {
    const room = snap.val();
    if (!room) { clearCurrentRoom(); window.location.href = 'index.html'; return; }
    isHost = (room.hostId === playerData.playerId);

    if (isHost) {
        document.getElementById('hostControls').classList.remove('hidden');
    }

    database.ref('rooms/' + roomCode + '/players').once('value', snap => {
        const pd = snap.val();
        if (!pd) { clearCurrentRoom(); window.location.href = 'index.html'; return; }
        players = Object.values(pd).sort((a, b) => a.joinOrder - b.joinOrder);
        
        if (isHost) initGame();
        attachGameStateListener();
    });
});

async function initGame() {
    // Get mode from room settings or default to friends
    const room = await database.ref('rooms/' + roomCode).once('value');
    currentMode = room.val().gameMode || 'friends';
    
    // Initialize game state
    const stateRef = database.ref('rooms/' + roomCode + '/wyrState');
    const existingState = await stateRef.once('value');
    
    // Only initialize if state doesn't exist
    if (!existingState.val()) {
        await stateRef.set({
            phase: 'voting',
            round: 1,
            mode: currentMode,
            currentQuestion: null,
            votes: {},
            revealed: false
        });
        
        // Start first round
        await startNewRound();
    }
}

function attachGameStateListener() {
    database.ref('rooms/' + roomCode + '/wyrState').on('value', snap => {
        const state = snap.val();
        if (!state) { showLoading(); return; }
        renderState(state);
    });
}

// ─── Scenario Selection ───
function getRandomScenario(mode) {
    const scenarios = SCENARIOS[mode] || SCENARIOS.friends;
    let availableScenarios = scenarios.filter((_, idx) => !usedScenarios.includes(idx));
    
    // Reset if we've used all scenarios
    if (availableScenarios.length === 0) {
        usedScenarios = [];
        availableScenarios = scenarios;
    }
    
    const randomIndex = Math.floor(Math.random() * availableScenarios.length);
    const selectedScenario = availableScenarios[randomIndex];
    const originalIndex = scenarios.indexOf(selectedScenario);
    usedScenarios.push(originalIndex);
    
    return selectedScenario;
}

function replacePlayerPlaceholders(text) {
    // Replace {player} with random player names
    const matches = text.match(/\{player\}/g);
    if (!matches) return text;
    
    let result = text;
    matches.forEach(() => {
        const randomPlayer = players[Math.floor(Math.random() * players.length)];
        result = result.replace('{player}', randomPlayer.name);
    });
    
    return result;
}

async function startNewRound() {
    if (!isHost) return;
    
    const scenario = getRandomScenario(currentMode);
    const optionA = replacePlayerPlaceholders(scenario[0]);
    const optionB = replacePlayerPlaceholders(scenario[1]);
    
    // 50/50 chance to reveal votes
    const willReveal = Math.random() < 0.5;
    
    await database.ref('rooms/' + roomCode + '/wyrState').update({
        phase: 'voting',
        round: roundNumber,
        currentQuestion: {
            optionA: optionA,
            optionB: optionB
        },
        votes: {},
        revealed: willReveal
    });
}

// ─── Rendering ───
function renderState(state) {
    if (state.phase === 'voting') {
        renderVoting(state);
    } else if (state.phase === 'results') {
        renderResults(state);
    }
}

function renderVoting(state) {
    // Wait for question to be loaded
    if (!state.currentQuestion) {
        showLoading();
        return;
    }
    
    const votes = state.votes || {};
    const myVote = votes[playerData.playerId];
    const totalVotes = Object.keys(votes).length;
    
    app.innerHTML = `
        <div class="game-title">Would You Rather</div>
        <div class="question-box">
            <div class="question-text">Would You Rather...</div>
            <div class="round-counter">Round ${state.round}</div>
        </div>
        
        ${myVote ? `
            <div class="waiting-box">
                <div class="waiting-text">Waiting for others...</div>
                <div class="voters-list" id="votersList"></div>
            </div>
        ` : `
            <div class="choice-container">
                <div class="choice-box option-a" onclick="vote('A')">
                    ${state.currentQuestion.optionA}
                </div>
                <div class="choice-box option-b" onclick="vote('B')">
                    ${state.currentQuestion.optionB}
                </div>
            </div>
        `}
    `;
    
    if (myVote) {
        updateVotersList(votes);
    }
    
    // Check if everyone voted
    if (isHost && totalVotes === players.length) {
        setTimeout(() => showResults(), 1000);
    }
}

function updateVotersList(votes) {
    const list = document.getElementById('votersList');
    if (!list) return;
    
    list.innerHTML = players.map(p => {
        const hasVoted = votes[p.playerId] !== undefined;
        return `
            <div class="voter-dot ${hasVoted ? 'voted' : ''}">
                <img src="${p.avatarUrl}" alt="">
                <span class="voter-name">${p.name}</span>
            </div>
        `;
    }).join('');
}

async function vote(choice) {
    await database.ref('rooms/' + roomCode + '/wyrState/votes/' + playerData.playerId).set(choice);
}

async function showResults() {
    if (!isHost) return;
    await database.ref('rooms/' + roomCode + '/wyrState').update({ phase: 'results' });
}

function renderResults(state) {
    // Wait for question to be loaded
    if (!state.currentQuestion) {
        showLoading();
        return;
    }
    
    const votes = state.votes || {};
    const votesA = Object.values(votes).filter(v => v === 'A').length;
    const votesB = Object.values(votes).filter(v => v === 'B').length;
    const total = votesA + votesB;
    const percentA = total > 0 ? Math.round((votesA / total) * 100) : 0;
    const percentB = total > 0 ? Math.round((votesB / total) * 100) : 0;
    
    const votersA = players.filter(p => votes[p.playerId] === 'A');
    const votersB = players.filter(p => votes[p.playerId] === 'B');
    
    app.innerHTML = `
        <div class="game-title">Results</div>
        
        ${state.revealed ? `
            <div class="exposed-banner">🔥 EXPOSED 🔥</div>
        ` : ''}
        
        <div class="results-box">
            <div class="results-title">Round ${state.round}</div>
            
            <div class="result-option ${percentA >= percentB ? 'winner' : ''}">
                <div class="result-option-text">${state.currentQuestion.optionA}</div>
                <div class="result-percentage">${percentA}%</div>
                ${state.revealed ? `
                    <div class="result-voters">
                        ${votersA.map(p => `
                            <div class="result-voter">
                                <img src="${p.avatarUrl}" alt="">
                                ${p.name}
                            </div>
                        `).join('')}
                    </div>
                ` : ''}
            </div>
            
            <div class="result-option ${percentB > percentA ? 'winner' : ''}">
                <div class="result-option-text">${state.currentQuestion.optionB}</div>
                <div class="result-percentage">${percentB}%</div>
                ${state.revealed ? `
                    <div class="result-voters">
                        ${votersB.map(p => `
                            <div class="result-voter">
                                <img src="${p.avatarUrl}" alt="">
                                ${p.name}
                            </div>
                        `).join('')}
                    </div>
                ` : ''}
            </div>
        </div>
        
        <div class="button-group">
            ${isHost ? `
                <button class="btn btn-primary" onclick="nextRound()">Next Round</button>
            ` : `
                <div class="waiting-box">
                    <div class="waiting-text">Waiting for host...</div>
                </div>
            `}
            <button class="btn" onclick="backToLobby()">End Game</button>
        </div>
    `;
}

async function nextRound() {
    if (!isHost) return;
    roundNumber++;
    await startNewRound();
}

async function backToLobby() {
    if (isHost) {
        await database.ref('rooms/' + roomCode).remove();
    }
    clearCurrentRoom();
    window.location.href = 'index.html';
}

async function endGame() {
    if (!isHost) return;
    const confirmed = confirm('Are you sure you want to end the game and return home?');
    if (confirmed) {
        await database.ref('rooms/' + roomCode).remove();
        clearCurrentRoom();
        window.location.href = 'index.html';
    }
}

window.vote = vote;
window.nextRound = nextRound;
window.backToLobby = backToLobby;
window.endGame = endGame;
</script>
</body>
</html>
