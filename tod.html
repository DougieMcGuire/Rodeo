<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Truth or Dare - RODEO</title>
<link rel="icon" href="favicon.ico">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: radial-gradient(circle at center, #ff0000 0%, #8b0000 100%);
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
}

/* Animated radial lines effect */
body::before {
    content: '';
    position: fixed;
    top: 50%;
    left: 50%;
    width: 200vmax;
    height: 200vmax;
    transform: translate(-50%, -50%);
    background: repeating-conic-gradient(
        from 0deg,
        transparent 0deg,
        transparent 2deg,
        rgba(0, 0, 0, 0.15) 2deg,
        rgba(0, 0, 0, 0.15) 4deg
    );
    pointer-events: none;
    z-index: 0;
}

.app {
    width: 100%;
    max-width: 600px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 25px;
    padding: 20px;
    position: relative;
    z-index: 1;
}

/* Loading */
.loading-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
}

.spinner {
    width: 60px;
    height: 60px;
    border: 8px solid rgba(255, 255, 255, 0.3);
    border-top: 8px solid white;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.loading-text {
    color: white;
    font-size: 1.5rem;
    font-weight: 800;
    text-transform: uppercase;
    text-shadow: 3px 3px 0 #000;
}

/* Game Title */
.game-title {
    font-size: 2.5rem;
    color: white;
    text-shadow: 4px 4px 0 #000;
    text-transform: uppercase;
    text-align: center;
    letter-spacing: 2px;
    margin-bottom: 10px;
}

/* Submission Phase */
.submission-info {
    background: white;
    padding: 20px;
    border: 5px solid #000;
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    text-align: center;
    width: 100%;
    margin-bottom: 10px;
}

.submission-info h3 {
    font-size: 1.3rem;
    font-weight: 900;
    margin-bottom: 10px;
    text-transform: uppercase;
}

.submission-info p {
    font-size: 0.95rem;
    color: #666;
}

.submissions-container {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.player-submission {
    background: white;
    padding: 25px;
    border: 5px solid #000;
    border-radius: 15px;
    box-shadow: 0 6px 0 #000;
}

.player-header {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
}

.player-header img {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: 4px solid #000;
    object-fit: cover;
}

.player-header h4 {
    font-size: 1.4rem;
    font-weight: 900;
    text-transform: uppercase;
}

.input-group {
    margin-bottom: 15px;
}

.input-label {
    font-size: 0.9rem;
    font-weight: 800;
    text-transform: uppercase;
    margin-bottom: 8px;
    color: #333;
}

.input-label.truth {
    color: #2EAD4B;
}

.input-label.dare {
    color: #ff0000;
}

.submission-input {
    width: 100%;
    padding: 15px;
    border: 4px solid #000;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 600;
    background: white;
    resize: vertical;
    min-height: 60px;
}

.submission-input:focus {
    outline: none;
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
}

.submit-all-btn {
    padding: 20px 40px;
    border: 5px solid #000;
    border-radius: 15px;
    font-size: 1.3rem;
    font-weight: 900;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    letter-spacing: 2px;
    box-shadow: 0 6px 0 #000, 0 6px 15px rgba(0, 0, 0, 0.3);
    background: linear-gradient(180deg, rgba(255, 182, 193, 0.95) 0%, rgba(255, 105, 180, 0.95) 100%);
    width: 100%;
    color: #000;
}

.submit-all-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 0 #000, 0 8px 20px rgba(0, 0, 0, 0.4);
}

.submit-all-btn:active:not(:disabled) {
    transform: translateY(2px);
    box-shadow: 0 4px 0 #000, 0 4px 10px rgba(0, 0, 0, 0.3);
}

.submit-all-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

/* Waiting for submissions */
.waiting-box {
    background: white;
    padding: 30px;
    border: 5px solid #000;
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    text-align: center;
    width: 100%;
}

.waiting-text {
    font-size: 1.5rem;
    font-weight: 800;
    margin-bottom: 20px;
    text-transform: uppercase;
}

.submission-status {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
}

.status-dot {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 12px;
    background: #f0f0f0;
    border: 4px solid #000;
}

.status-dot.submitted {
    background: #90EE90;
}

.status-dot img {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 3px solid #000;
    object-fit: cover;
}

.status-dot .status-name {
    font-size: 0.9rem;
    font-weight: 800;
    color: #333;
}

/* Wheel Phase */
.wheel-container {
    position: relative;
    width: min(85vw, 85vh, 400px);
    aspect-ratio: 1;
}

.wheel-outer {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 8px solid #000;
    background: #111;
    overflow: hidden;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
}

.wheel-hub {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: #FFD700;
    border: 6px solid #000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
}

.ticker {
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 20px solid transparent;
    border-right: 20px solid transparent;
    border-top: 40px solid #ff0000;
    filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.4));
    z-index: 10;
}

.selected-player-box {
    background: white;
    padding: 30px;
    border: 5px solid #000;
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    text-align: center;
    width: 100%;
}

.selected-player-name {
    font-size: 2rem;
    font-weight: 900;
    text-transform: uppercase;
    margin-bottom: 20px;
    color: #ff0000;
}

.choice-buttons {
    display: flex;
    gap: 15px;
    margin-top: 20px;
}

.choice-btn {
    flex: 1;
    padding: 30px 20px;
    border: 5px solid #000;
    border-radius: 15px;
    font-size: 1.3rem;
    font-weight: 900;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    box-shadow: 0 6px 0 #000;
    position: relative;
}

.choice-btn:hover:not(:disabled) {
    transform: translateY(-4px);
    box-shadow: 0 10px 0 #000;
}

.choice-btn:active:not(:disabled) {
    transform: translateY(2px);
    box-shadow: 0 4px 0 #000;
}

.choice-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
}

.truth-btn {
    background: linear-gradient(180deg, #90EE90 0%, #7FD87F 100%);
}

.dare-btn {
    background: linear-gradient(180deg, #FFB6C1 0%, #FF69B4 100%);
}

.choice-count {
    display: block;
    font-size: 0.8rem;
    margin-top: 5px;
    font-weight: 700;
}

/* Challenge Display */
.challenge-box {
    background: white;
    padding: 40px;
    border: 5px solid #000;
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    text-align: center;
    width: 100%;
}

.challenge-type {
    font-size: 1.2rem;
    font-weight: 900;
    text-transform: uppercase;
    margin-bottom: 10px;
}

.challenge-type.truth {
    color: #2EAD4B;
}

.challenge-type.dare {
    color: #ff0000;
}

.challenge-text {
    font-size: 1.5rem;
    font-weight: 700;
    line-height: 1.4;
    margin: 20px 0;
    color: #000;
}

.challenge-for {
    font-size: 1rem;
    color: #666;
    margin-bottom: 30px;
}

/* Buttons */
.btn {
    padding: 20px 40px;
    border: 5px solid #000;
    border-radius: 15px;
    font-size: 1.2rem;
    font-weight: 900;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 2px;
    box-shadow: 0 6px 0 #000, 0 6px 15px rgba(0, 0, 0, 0.3);
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 200, 200, 0.95) 100%);
    width: 100%;
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 0 #000, 0 8px 20px rgba(0, 0, 0, 0.4);
}

.btn:active {
    transform: translateY(2px);
    box-shadow: 0 4px 0 #000, 0 4px 10px rgba(0, 0, 0, 0.3);
}

.btn-primary {
    background: linear-gradient(180deg, rgba(255, 182, 193, 0.95) 0%, rgba(255, 105, 180, 0.95) 100%);
}

.btn-danger {
    background: linear-gradient(180deg, #ff6b6b 0%, #ee5a6f 100%);
    color: white;
}

/* Host Controls */
.host-controls {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 100;
}

.host-controls .btn {
    padding: 12px 24px;
    font-size: 0.9rem;
    width: auto;
}

.spin-btn {
    padding: 25px 60px;
    font-size: 1.5rem;
}

/* Responsive */
@media (max-width: 600px) {
    .game-title {
        font-size: 2rem;
    }

    .choice-buttons {
        flex-direction: column;
    }

    .challenge-text {
        font-size: 1.2rem;
    }

    .host-controls {
        bottom: 10px;
        right: 10px;
    }
}

.hidden {
    display: none !important;
}
</style>
</head>
<body>

<div class="app" id="app"></div>

<div class="host-controls hidden" id="hostControls">
    <button class="btn btn-danger" onclick="endGame()">End Game</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
// ─── Firebase ───
const firebaseConfig = {
    apiKey: "AIzaSyBaJXCqGmUaGumvcWNE7w4FOOzTJVDH-yg",
    authDomain: "polorfriends.firebaseapp.com",
    databaseURL: "https://polorfriends-default-rtdb.firebaseio.com",
    projectId: "polorfriends",
    storageBucket: "polorfriends.firebasestorage.app",
    messagingSenderId: "328546525972",
    appId: "1:328546525972:web:a6fe0f0a45b4565a7b1801",
    measurementId: "G-07B4713DQQ"
};
firebase.initializeApp(firebaseConfig);
const database = firebase.database();

// ─── Utils ───
function getPlayerData() {
    const d = localStorage.getItem('playerData');
    return d ? JSON.parse(d) : null;
}
function getCurrentRoom() { return localStorage.getItem('currentRoom'); }
function clearCurrentRoom() { localStorage.removeItem('currentRoom'); }

// ─── State ───
const urlParams = new URLSearchParams(window.location.search);
const roomCode = urlParams.get('room') || getCurrentRoom();
const playerData = getPlayerData();
if (!roomCode || !playerData) window.location.href = 'index.html';

let players = [];
let isHost = false;
let currentRotation = 0;
let animFrameId = null;
let wheelCanvas, wheelCtx;
let wheelSize = 0;

const SEGMENT_COLORS = [
    '#E8453C', '#E8832A', '#D4A72C', '#2EAD4B',
    '#2980D4', '#6C3ED4', '#C23EAA', '#D44E6B',
    '#1D9C8C', '#A86B2D'
];

const app = document.getElementById('app');

function showLoading() {
    app.innerHTML = `
        <div class="loading-screen">
            <div class="spinner"></div>
            <div class="loading-text">Loading game...</div>
        </div>
    `;
}

showLoading();

// ─── Initialize ───
database.ref('rooms/' + roomCode).once('value', snap => {
    const room = snap.val();
    if (!room) { clearCurrentRoom(); window.location.href = 'index.html'; return; }
    isHost = (room.hostId === playerData.playerId);

    if (isHost) {
        document.getElementById('hostControls').classList.remove('hidden');
    }

    database.ref('rooms/' + roomCode + '/players').once('value', snap => {
        const pd = snap.val();
        if (!pd) { clearCurrentRoom(); window.location.href = 'index.html'; return; }
        players = Object.values(pd).sort((a, b) => a.joinOrder - b.joinOrder);
        
        if (isHost) initGame();
        attachGameStateListener();
    });
});

async function initGame() {
    const stateRef = database.ref('rooms/' + roomCode + '/todState');
    const existingState = await stateRef.once('value');
    
    if (!existingState.val()) {
        await stateRef.set({
            phase: 'submission',
            submissions: {},
            playerChallenges: {},
            currentPlayer: null,
            currentChallenge: null
        });
        
        // Initialize player challenges structure
        const playerChallenges = {};
        players.forEach(player => {
            playerChallenges[player.playerId] = {
                truths: [],
                dares: [],
                truthsRemaining: players.length - 1,
                daresRemaining: players.length - 1
            };
        });
        
        await database.ref('rooms/' + roomCode + '/todState/playerChallenges').set(playerChallenges);
    }
}

function attachGameStateListener() {
    database.ref('rooms/' + roomCode + '/todState').on('value', snap => {
        const state = snap.val();
        if (!state) { showLoading(); return; }
        renderState(state);
    });
}

// ─── Rendering ───
function renderState(state) {
    if (state.phase === 'submission') {
        renderSubmission(state);
    } else if (state.phase === 'wheel') {
        renderWheel(state);
    } else if (state.phase === 'selection') {
        renderSelection(state);
    } else if (state.phase === 'challenge') {
        renderChallenge(state);
    }
}

// ─── SUBMISSION PHASE ───
function renderSubmission(state) {
    const mySubmissions = state.submissions[playerData.playerId] || {};
    const hasSubmitted = mySubmissions.submitted === true;
    
    if (hasSubmitted) {
        renderWaitingForSubmissions(state);
        return;
    }
    
    // Get other players
    const otherPlayers = players.filter(p => p.playerId !== playerData.playerId);
    
    app.innerHTML = `
        <div class="game-title">Truth or Dare</div>
        
        <div class="submission-info">
            <h3>📝 Submission Phase</h3>
            <p>Submit 1 Truth and 1 Dare for each player</p>
        </div>
        
        <div class="submissions-container" id="submissionsContainer">
            ${otherPlayers.map(player => `
                <div class="player-submission">
                    <div class="player-header">
                        <img src="${player.avatarUrl}" alt="${player.name}">
                        <h4>${player.name}</h4>
                    </div>
                    
                    <div class="input-group">
                        <div class="input-label truth">Truth</div>
                        <textarea 
                            class="submission-input" 
                            id="truth-${player.playerId}"
                            placeholder="Enter a truth question..."
                        ></textarea>
                    </div>
                    
                    <div class="input-group">
                        <div class="input-label dare">Dare</div>
                        <textarea 
                            class="submission-input" 
                            id="dare-${player.playerId}"
                            placeholder="Enter a dare..."
                        ></textarea>
                    </div>
                </div>
            `).join('')}
        </div>
        
        <button class="submit-all-btn" onclick="submitAll()">Submit All</button>
    `;
}

async function submitAll() {
    const otherPlayers = players.filter(p => p.playerId !== playerData.playerId);
    const submissions = {};
    
    // Validate all fields are filled
    for (const player of otherPlayers) {
        const truth = document.getElementById(`truth-${player.playerId}`).value.trim();
        const dare = document.getElementById(`dare-${player.playerId}`).value.trim();
        
        if (!truth || !dare) {
            alert('Please fill in all truth and dare fields!');
            return;
        }
        
        submissions[player.playerId] = { truth, dare };
    }
    
    // Save submissions
    await database.ref('rooms/' + roomCode + '/todState/submissions/' + playerData.playerId).set({
        submitted: true,
        data: submissions
    });
    
    // Add to player challenges
    for (const targetPlayerId in submissions) {
        const { truth, dare } = submissions[targetPlayerId];
        
        await database.ref('rooms/' + roomCode + '/todState/playerChallenges/' + targetPlayerId + '/truths').push(truth);
        await database.ref('rooms/' + roomCode + '/todState/playerChallenges/' + targetPlayerId + '/dares').push(dare);
    }
    
    // Check if all submitted
    checkAllSubmitted();
}

async function checkAllSubmitted() {
    if (!isHost) return;
    
    const submissions = await database.ref('rooms/' + roomCode + '/todState/submissions').once('value');
    const submissionsData = submissions.val() || {};
    
    const allSubmitted = players.every(p => submissionsData[p.playerId]?.submitted === true);
    
    if (allSubmitted) {
        setTimeout(() => {
            database.ref('rooms/' + roomCode + '/todState').update({ phase: 'wheel' });
        }, 1000);
    }
}

function renderWaitingForSubmissions(state) {
    const submissions = state.submissions || {};
    
    app.innerHTML = `
        <div class="game-title">Truth or Dare</div>
        
        <div class="waiting-box">
            <div class="waiting-text">Waiting for all submissions...</div>
            <div class="submission-status">
                ${players.map(p => {
                    const submitted = submissions[p.playerId]?.submitted === true;
                    return `
                        <div class="status-dot ${submitted ? 'submitted' : ''}">
                            <img src="${p.avatarUrl}" alt="">
                            <span class="status-name">${p.name}</span>
                        </div>
                    `;
                }).join('')}
            </div>
        </div>
    `;
    
    // Host checks if all submitted
    if (isHost) {
        checkAllSubmitted();
    }
}

// ─── WHEEL PHASE ───
function renderWheel(state) {
    app.innerHTML = `
        <div class="game-title">Truth or Dare</div>
        
        <div class="wheel-container" id="wheelContainer">
            <div class="ticker"></div>
            <div class="wheel-outer">
                <canvas id="wheelCanvas"></canvas>
                <div class="wheel-hub">🎯</div>
            </div>
        </div>
        
        ${isHost ? `
            <button class="btn btn-primary spin-btn" onclick="spinWheel()">Spin Wheel</button>
        ` : `
            <div class="waiting-box">
                <div class="waiting-text">Waiting for host to spin...</div>
            </div>
        `}
    `;
    
    initCanvas();
    drawWheel(0);
}

function initCanvas() {
    wheelCanvas = document.getElementById('wheelCanvas');
    if (!wheelCanvas) return;
    const wrapper = document.getElementById('wheelContainer');
    const dpr = window.devicePixelRatio || 1;
    const rect = wrapper.getBoundingClientRect();
    wheelSize = rect.width - 16;
    wheelCanvas.width = wheelSize * dpr;
    wheelCanvas.height = wheelSize * dpr;
    wheelCtx = wheelCanvas.getContext('2d');
    wheelCtx.scale(dpr, dpr);
}

function drawWheel(rotation) {
    if (!wheelCtx) return;
    const cx = wheelSize / 2;
    const cy = wheelSize / 2;
    const r = wheelSize / 2 - 2;
    const n = players.length;
    const slice = (Math.PI * 2) / n;

    wheelCtx.clearRect(0, 0, wheelSize, wheelSize);
    wheelCtx.save();
    wheelCtx.translate(cx, cy);
    wheelCtx.rotate((rotation * Math.PI) / 180);

    for (let i = 0; i < n; i++) {
        const startAngle = i * slice - Math.PI / 2;
        const endAngle = startAngle + slice;
        const color = SEGMENT_COLORS[i % SEGMENT_COLORS.length];

        wheelCtx.beginPath();
        wheelCtx.moveTo(0, 0);
        wheelCtx.arc(0, 0, r, startAngle, endAngle);
        wheelCtx.closePath();
        wheelCtx.fillStyle = color;
        wheelCtx.fill();

        const grad = wheelCtx.createRadialGradient(0, 0, r * 0.6, 0, 0, r);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        grad.addColorStop(1, 'rgba(0,0,0,0.2)');
        wheelCtx.beginPath();
        wheelCtx.moveTo(0, 0);
        wheelCtx.arc(0, 0, r, startAngle, endAngle);
        wheelCtx.closePath();
        wheelCtx.fillStyle = grad;
        wheelCtx.fill();

        wheelCtx.beginPath();
        wheelCtx.moveTo(0, 0);
        wheelCtx.lineTo(Math.cos(startAngle) * r, Math.sin(startAngle) * r);
        wheelCtx.strokeStyle = 'rgba(0,0,0,0.35)';
        wheelCtx.lineWidth = 2;
        wheelCtx.stroke();

        wheelCtx.save();
        const midAngle = startAngle + slice / 2;
        wheelCtx.rotate(midAngle);
        wheelCtx.textAlign = 'right';
        wheelCtx.fillStyle = '#fff';
        const fontSize = Math.max(11, Math.min(16, r / (n * 0.55)));
        wheelCtx.font = `bold ${fontSize}px -apple-system, sans-serif`;
        wheelCtx.shadowColor = 'rgba(0,0,0,0.6)';
        wheelCtx.shadowBlur = 4;
        wheelCtx.shadowOffsetX = 1;
        wheelCtx.shadowOffsetY = 1;

        const name = players[i].name;
        const maxLen = n > 6 ? 6 : 10;
        const displayName = name.length > maxLen ? name.substring(0, maxLen) + '…' : name;
        wheelCtx.fillText(displayName, r - 18, fontSize * 0.35);
        wheelCtx.shadowBlur = 0;
        wheelCtx.restore();
    }

    wheelCtx.restore();
}

function getSelectedPlayer(rotation) {
    const n = players.length;
    const slice = 360 / n;
    let normalizedAngle = (360 - (rotation % 360) + 360) % 360;
    const idx = Math.floor(normalizedAngle / slice) % n;
    return players[idx];
}

async function spinWheel() {
    if (!isHost) return;
    
    const winner = players[Math.floor(Math.random() * players.length)];
    const winnerIndex = players.indexOf(winner);
    const segmentAngle = 360 / players.length;
    const baseSpins = 1800 + Math.random() * 720;
    const targetAngle = winnerIndex * segmentAngle + segmentAngle / 2;
    const finalRotation = baseSpins + (360 - targetAngle);
    
    // Start spinning animation
    const startTime = performance.now();
    const duration = 4200;
    
    function animate(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 4);
        currentRotation = finalRotation * eased;
        
        drawWheel(currentRotation);
        
        if (progress < 1) {
            animFrameId = requestAnimationFrame(animate);
        } else {
            // Spin complete - move to selection phase
            setTimeout(() => {
                database.ref('rooms/' + roomCode + '/todState').update({
                    phase: 'selection',
                    currentPlayer: winner.playerId
                });
            }, 500);
        }
    }
    
    animFrameId = requestAnimationFrame(animate);
}

// ─── SELECTION PHASE ───
function renderSelection(state) {
    const selectedPlayer = players.find(p => p.playerId === state.currentPlayer);
    if (!selectedPlayer) return;
    
    const challenges = state.playerChallenges[state.currentPlayer] || {};
    const truthsRemaining = challenges.truthsRemaining || 0;
    const daresRemaining = challenges.daresRemaining || 0;
    
    const isSelectedPlayer = state.currentPlayer === playerData.playerId;
    
    app.innerHTML = `
        <div class="game-title">Truth or Dare</div>
        
        <div class="selected-player-box">
            <div class="selected-player-name">${selectedPlayer.name}</div>
            
            ${isSelectedPlayer ? `
                <p style="font-size: 1.2rem; font-weight: 700; margin-bottom: 20px;">
                    Choose your fate!
                </p>
                
                <div class="choice-buttons">
                    <button 
                        class="choice-btn truth-btn" 
                        onclick="selectType('truth')"
                        ${truthsRemaining === 0 ? 'disabled' : ''}
                    >
                        Truth
                        <span class="choice-count">${truthsRemaining} available</span>
                    </button>
                    
                    <button 
                        class="choice-btn dare-btn" 
                        onclick="selectType('dare')"
                        ${daresRemaining === 0 ? 'disabled' : ''}
                    >
                        Dare
                        <span class="choice-count">${daresRemaining} available</span>
                    </button>
                </div>
            ` : `
                <p style="font-size: 1.2rem; font-weight: 700;">
                    Waiting for ${selectedPlayer.name} to choose...
                </p>
                <div style="margin-top: 20px;">
                    <div style="font-size: 0.9rem; color: #666;">
                        Truth: ${truthsRemaining} | Dare: ${daresRemaining}
                    </div>
                </div>
            `}
        </div>
    `;
}

async function selectType(type) {
    const state = await database.ref('rooms/' + roomCode + '/todState').once('value');
    const stateVal = state.val();
    const challenges = stateVal.playerChallenges[stateVal.currentPlayer];
    
    // Get random challenge of this type
    const challengeList = type === 'truth' ? challenges.truths : challenges.dares;
    const challengeKeys = Object.keys(challengeList);
    
    if (challengeKeys.length === 0) return;
    
    const randomKey = challengeKeys[Math.floor(Math.random() * challengeKeys.length)];
    const challenge = challengeList[randomKey];
    
    // Remove this challenge and decrement count
    await database.ref(`rooms/${roomCode}/todState/playerChallenges/${stateVal.currentPlayer}/${type}s/${randomKey}`).remove();
    await database.ref(`rooms/${roomCode}/todState/playerChallenges/${stateVal.currentPlayer}/${type}sRemaining`).set(challengeKeys.length - 1);
    
    // Move to challenge phase
    await database.ref('rooms/' + roomCode + '/todState').update({
        phase: 'challenge',
        currentChallenge: {
            type: type,
            text: challenge
        }
    });
}

// ─── CHALLENGE PHASE ───
function renderChallenge(state) {
    const selectedPlayer = players.find(p => p.playerId === state.currentPlayer);
    const challenge = state.currentChallenge;
    
    app.innerHTML = `
        <div class="game-title">Truth or Dare</div>
        
        <div class="challenge-box">
            <div class="challenge-type ${challenge.type}">${challenge.type.toUpperCase()}</div>
            <div class="challenge-for">For ${selectedPlayer.name}</div>
            <div class="challenge-text">${challenge.text}</div>
            
            ${isHost ? `
                <button class="btn btn-primary" onclick="nextTurn()">Next Turn</button>
            ` : `
                <div class="waiting-box" style="margin-top: 20px; padding: 20px;">
                    <div class="waiting-text" style="font-size: 1rem;">Waiting for host...</div>
                </div>
            `}
        </div>
    `;
}

async function nextTurn() {
    if (!isHost) return;
    await database.ref('rooms/' + roomCode + '/todState').update({
        phase: 'wheel',
        currentPlayer: null,
        currentChallenge: null
    });
}

// ─── Actions ───
async function endGame() {
    if (!isHost) return;
    const confirmed = confirm('Are you sure you want to end the game and return to the lobby?');
    if (confirmed) {
        await database.ref('rooms/' + roomCode).update({ state: 'lobby' });
        await database.ref('rooms/' + roomCode + '/todState').remove();
        window.location.href = `lobby.html?room=${roomCode}`;
    }
}

window.submitAll = submitAll;
window.spinWheel = spinWheel;
window.selectType = selectType;
window.nextTurn = nextTurn;
window.endGame = endGame;

// ─── Resize ───
window.addEventListener('resize', () => {
    if (document.getElementById('wheelCanvas')) {
        initCanvas();
        drawWheel(currentRotation);
    }
});
</script>
