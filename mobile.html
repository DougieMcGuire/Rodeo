<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ff0000">
    <title>RODEO</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
        }
        
        html { 
            width: 100%; 
            height: 100%; 
            background: #ff0000;
            overscroll-behavior: none;
        }
        
        body { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: #ff0000;
            position: fixed;
            overscroll-behavior: none;
        }
        
        #app { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100vh;
            height: -webkit-fill-available;
            border: none; 
            background: #ff0000;
        }
        
        #prompt { 
            display: none; 
            position: fixed; 
            top: 0;
            left: 0; 
            width: 100%; 
            height: 100%;
            background: rgba(0,0,0,0.85); 
            z-index: 999999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        #prompt.show { display: flex; }
        
        .modal { 
            background: #fff; 
            border-radius: 20px; 
            padding: 30px 20px; 
            max-width: 400px;
            width: 100%;
            text-align: center;
            position: relative;
        }
        
        .close { 
            position: absolute; 
            top: 10px; 
            right: 15px; 
            font-size: 2rem; 
            border: none; 
            background: none; 
            color: #999; 
            cursor: pointer;
            width: 40px;
            height: 40px;
        }
        
        .logo { font-size: 3rem; margin-bottom: 15px; }
        
        h1 { 
            font-size: 1.8rem; 
            font-weight: 900;
            margin-bottom: 10px; 
        }
        
        .subtitle { 
            color: #666; 
            margin-bottom: 25px;
            font-size: 1rem;
        }
        
        .gif {
            width: 100%;
            max-width: 300px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 3px solid #000;
        }
        
        .note {
            font-size: 0.9rem;
            color: #666;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <iframe id="app" src="index.html"></iframe>
    
    <div id="prompt">
        <div class="modal">
            <button class="close" onclick="hide()">×</button>
            <div class="logo">🤠</div>
            <h1>Install RODEO</h1>
            <p class="subtitle">Add to your home screen for the best experience</p>
            <img src="https://github.com/DougieMcGuire/Rodeo/blob/49dff7cb68b6f895c6f663ef862ce0ab947648d7/assets/632FA4E9-04F8-470A-9538-E400B1F45AB1.gif" alt="Install guide" class="gif">
            <p class="note">Tap the share button ⬆️ then "Add to Home Screen"</p>
        </div>
    </div>

    <script>
        const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
        const isInIframe = window.self !== window.top;
        const hasSeenPrompt = localStorage.getItem('rodeo-prompt-seen');
        
        // Show prompt ONCE if NOT standalone and NOT in iframe and NOT seen before
        if (!isStandalone && !isInIframe && !hasSeenPrompt) {
            setTimeout(() => {
                document.getElementById('prompt').classList.add('show');
                localStorage.setItem('rodeo-prompt-seen', 'true');
            }, 800);
        }
        
        function hide() {
            document.getElementById('prompt').classList.remove('show');
        }
        
        // Close on outside tap
        document.getElementById('prompt').onclick = function(e) {
            if (e.target === this) hide();
        };
        
        // Prevent bounce/overscroll
        document.addEventListener('touchmove', function(e) {
            if (e.target === document.body || e.target === document.documentElement) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
