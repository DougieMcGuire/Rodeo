<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>RODEO</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        #app { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        #prompt { 
            display: none; 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            background: rgba(0,0,0,0.9); 
            z-index: 9999; 
        }
        #prompt.show { display: block; }
        .box { background: #fff; border-radius: 20px 20px 0 0; padding: 20px; }
        .close { position: absolute; top: 10px; right: 15px; font-size: 2rem; border: none; background: none; color: #999; }
        h1 { font-size: 1.5rem; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 15px; }
        .steps { background: #fff0f0; border: 2px solid #f00; border-radius: 10px; padding: 15px; }
        .step { font-weight: bold; margin: 8px 0; }
        .icon { background: #f00; color: #fff; padding: 2px 8px; border-radius: 5px; }
    </style>
</head>
<body>
    <iframe id="app" src="index.html"></iframe>
    
    <div id="prompt">
        <div class="box">
            <button class="close" onclick="hide()">×</button>
            <h1>🤠 Install RODEO</h1>
            <p>2-tap install for full screen</p>
            <div class="steps">
                <div class="step">1. Tap <span class="icon">⬆️</span> below</div>
                <div class="step">2. Tap "Add to Home Screen"</div>
            </div>
        </div>
    </div>

    <script>
        const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
        const isInIframe = window.self !== window.top;
        
        // Show prompt if NOT standalone and NOT in iframe
        if (!isStandalone && !isInIframe) {
            setTimeout(() => document.getElementById('prompt').classList.add('show'), 500);
        }
        
        function hide() {
            document.getElementById('prompt').classList.remove('show');
        }
        
        // Close on outside tap
        document.getElementById('prompt').onclick = function(e) {
            if (e.target.id === 'prompt') hide();
        };
    </script>
</body>
</html>
