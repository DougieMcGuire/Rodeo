<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>RODEO</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: #000;
            position: fixed;
        }
        
        #app { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            border: none; 
            background: transparent;
        }
        
        #prompt { 
            display: none; 
            position: fixed; 
            top: 0;
            left: 0; 
            width: 100%; 
            height: 100%;
            background: rgba(0,0,0,0.9); 
            z-index: 999999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        #prompt.show { display: flex; }
        
        .modal { 
            background: #fff; 
            border-radius: 24px; 
            padding: 32px 24px; 
            max-width: 380px;
            width: 100%;
            text-align: center;
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        
        .close { 
            position: absolute; 
            top: 12px; 
            right: 12px; 
            font-size: 28px; 
            border: none; 
            background: #f0f0f0; 
            color: #666; 
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .logo { 
            font-size: 64px; 
            margin-bottom: 16px;
        }
        
        h1 { 
            font-size: 28px; 
            font-weight: 900;
            margin-bottom: 8px;
            color: #000;
        }
        
        .subtitle { 
            color: #666; 
            margin-bottom: 24px;
            font-size: 15px;
        }
        
        .gif {
            width: 100%;
            max-width: 280px;
            border-radius: 16px;
            margin: 0 auto 20px;
            border: 2px solid #e0e0e0;
            display: block;
        }
        
        .note {
            font-size: 14px;
            color: #888;
            margin-top: 16px;
            background: #f8f8f8;
            padding: 12px 16px;
            border-radius: 12px;
        }
        
        .note strong {
            color: #000;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <iframe id="app" src="index.html"></iframe>
    
    <div id="prompt">
        <div class="modal">
            <button class="close" onclick="hidePrompt()">×</button>
            <div class="logo">🤠</div>
            <h1>Install RODEO</h1>
            <p class="subtitle">Add to your home screen for the best experience</p>
            <img src="https://github.com/DougieMcGuire/Rodeo/raw/49dff7cb68b6f895c6f663ef862ce0ab947648d7/assets/632FA4E9-04F8-470A-9538-E400B1F45AB1.gif" alt="Install guide" class="gif">
            <p class="note"><strong>Tap</strong> the share button <strong>⬆️</strong><br>then <strong>"Add to Home Screen"</strong></p>
        </div>
    </div>

    <script>
        const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
        const isInIframe = window.self !== window.top;
        const hasSeenPrompt = false;
        
        function showInstallPrompt() {
            if (!isStandalone && !isInIframe && !hasSeenPrompt) {
                setTimeout(() => {
                    document.getElementById('prompt').classList.add('show');
                }, 1000);
            }
        }
        
        function hidePrompt() {
            document.getElementById('prompt').classList.remove('show');
        }
        
        document.getElementById('prompt').onclick = function(e) {
            if (e.target === this) hidePrompt();
        };
        
        document.addEventListener('touchmove', function(e) {
            if (e.target === document.body || e.target === document.documentElement) {
                e.preventDefault();
            }
        }, { passive: false });
        
        showInstallPrompt();
        
        // Match wrapper background to iframe background
        function matchBackground() {
            try {
                const iframe = document.getElementById('app');
                const iframeDoc = iframe.contentWindow.document;
                const bgColor = window.getComputedStyle(iframeDoc.body).backgroundColor;
                
                if (bgColor && bgColor !== 'rgba(0, 0, 0, 0)') {
                    document.documentElement.style.backgroundColor = bgColor;
                    document.body.style.backgroundColor = bgColor;
                    
                    // Also update Safari theme
                    let themeMeta = document.querySelector('meta[name="theme-color"]');
                    if (!themeMeta) {
                        themeMeta = document.createElement('meta');
                        themeMeta.name = 'theme-color';
                        document.head.appendChild(themeMeta);
                    }
                    themeMeta.content = bgColor;
                }
            } catch (e) {}
        }
        
        document.getElementById('app').addEventListener('load', function() {
            matchBackground();
            setTimeout(matchBackground, 100);
            setTimeout(matchBackground, 500);
            setTimeout(matchBackground, 1000);
        });
    </script>
</body>
</html>
