<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobby - Rodeo</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="lobby-screen">
            <h1 class="lobby-title">Game Lobby</h1>
            
            <div class="room-code-display">
                <p class="room-code-label">Room Code</p>
                <h2 class="room-code" id="roomCodeDisplay">--- ---</h2>
                <p class="room-code-hint">Share this code with friends</p>
                <button class="btn btn-qr" id="showQrBtn">Show QR Code</button>
            </div>

            <div id="qrModal" class="qr-modal" style="display: none;">
                <div class="qr-modal-content">
                    <button class="qr-close" id="closeQrBtn">×</button>
                    <h3>Scan to Join</h3>
                    <div id="qrCode"></div>
                </div>
            </div>

            <div class="players-section">
                <h3>Players (<span id="playerCount">0</span>)</h3>
                <div id="playersList" class="players-list">
                    <!-- Players will be added here dynamically -->
                </div>
            </div>

            <div class="lobby-actions">
                <button class="btn btn-primary" id="startGameBtn" style="display: none;">Start Game</button>
                <button class="btn btn-danger" id="leaveBtn">Leave Game</button>
            </div>

            <div id="waitingMessage" class="waiting-message" style="display: none;">
                <div class="spinner"></div>
                <p>Waiting for host to start game...</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="config.js"></script>
    <script src="lobby.js"></script>
</body>
</html>
