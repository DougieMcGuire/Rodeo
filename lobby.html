<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobby - RODEO</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="lobby-screen">
            <h1 class="game-title">WAITING ROOM</h1>
            
            <div class="room-code-box">
                <p class="room-code-label">Room Code</p>
                <h2 class="room-code" id="roomCode">--- ---</h2>
                <p class="room-code-hint">Share with friends to join</p>
            </div>

            <div class="players-list" id="playersList">
                <!-- Players will appear here -->
            </div>

            <div id="hostControls" style="display: none;">
                <button class="btn btn-primary btn-large" id="startGameBtn">START GAME</button>
            </div>

            <button class="btn btn-danger" id="leaveBtn">LEAVE</button>
        </div>
    </div>

<!-- Mobile optimizations -->
<script src="mobile.js"></script>

<!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <script src="config.js"></script>
    <script src="lobby.js"></script>
</body>
</html>
