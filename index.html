<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>RODEO - Party Games</title>
    
    <!-- Redirect mobile users to mobile.html -->
    <script>
        (function() {
            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            const isInIframe = window.self !== window.top;
            
            // Only redirect if mobile AND not already in iframe
            if (isMobile && !isInIframe && !window.location.pathname.includes('mobile.html')) {
                console.log('Mobile detected, redirecting to mobile.html');
                window.location.href = 'mobile.html';
            }
        })();
    </script>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RODEO">
    <meta name="theme-color" content="#ff0000">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Home Screen -->
        <div id="homeScreen" class="home-screen">
            <img src="assets/wordmark.png" alt="RODEO" class="wordmark">
            
            <div class="profile-section">
                <div class="avatar-upload" id="avatarUpload">
                    <input type="file" id="avatarInput" accept="image/*" style="display: none;">
                    <div class="avatar-circle">
                        <svg class="avatar-placeholder" id="avatarPlaceholder" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <circle cx="12" cy="8" r="4"/>
                            <path d="M6 21v-2a4 4 0 014-4h4a4 4 0 014 4v2"/>
                        </svg>
                        <img id="avatarPreview" class="avatar-preview" style="display: none;">
                    </div>
                    <div class="edit-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
                            <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
                        </svg>
                    </div>
                </div>

                <input 
                    type="text" 
                    id="nameInput" 
                    class="name-input" 
                    placeholder="enter name here"
                    maxlength="20"
                >
            </div>

            <button class="btn btn-primary" id="joinBtn">JOIN</button>
            <button class="btn" id="hostBtn">HOST</button>
        </div>
    </div>

    <!-- Join Code Modal -->
    <div id="joinModal" class="modal">
        <div class="modal-content">
            <h2>Enter Room Code</h2>
            <input 
                type="text" 
                id="codeInput" 
                class="code-input" 
                placeholder="123 456"
                maxlength="7"
                inputmode="numeric"
            >
            <div class="modal-buttons">
                <button class="btn btn-small btn-cancel" id="cancelJoinBtn">Cancel</button>
                <button class="btn btn-small btn-primary" id="submitJoinBtn">Join</button>
            </div>
        </div>
    </div>

    <!-- Mobile detection must load FIRST -->
    <script src="mobile.js"></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <script src="config.js"></script>
    <script src="home.js"></script>
</body>
</html>
