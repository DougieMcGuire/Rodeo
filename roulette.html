<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Roulette - RODEO</title>
<link rel="icon" href="favicon.ico">

<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#141414;
    --bg-red:#6b0000;
    --gold:#FFD700;
    --red:#FF3B30;
    --white:#ffffff;
    --gray:#2a2a2a;
    --light-gray:#aaa;
    --outline:#000;
}

body{
    font-family:'Fredoka',sans-serif;
    background:var(--bg);
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    transition:background .3s;
}

body.you-selected{
    background:var(--bg-red);
}

/* Layout */
.app{
    width:100%;
    height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:20px;
    padding:20px;
}

/* Hover name */
.hover-name{
    font-size:clamp(1.3rem,5vw,2rem);
    font-weight:700;
    background:var(--gray);
    color:var(--white);
    padding:10px 20px;
    border:4px solid var(--outline);
    border-radius:14px;
    text-transform:uppercase;
    letter-spacing:2px;
    min-height:2.5rem;
    display:flex;
    align-items:center;
    justify-content:center;
}

.hover-name.is-you{
    background:var(--red);
    color:#fff;
    transform:scale(1.05);
}

/* Wheel */
.wheel-wrapper{
    position:relative;
    width:min(80vw,80vh,380px);
    aspect-ratio:1;
}

.wheel-outer{
    width:100%;
    height:100%;
    border-radius:50%;
    border:8px solid var(--outline);
    background:#111;
    overflow:hidden;
}

canvas{
    width:100%;
    height:100%;
    display:block;
}

/* Center hub */
.wheel-hub{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:60px;
    height:60px;
    border-radius:50%;
    background:var(--gold);
    border:6px solid var(--outline);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.5rem;
}

/* Pointer */
.ticker{
    position:absolute;
    top:-8px;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:18px solid transparent;
    border-right:18px solid transparent;
    border-top:36px solid var(--red);
}

/* Hold ring */
.hold-ring{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
}

.hold-dot{
    display:flex;
    align-items:center;
    gap:6px;
    padding:6px 12px;
    border-radius:999px;
    background:var(--gray);
    border:3px solid var(--outline);
}

.hold-dot img{
    width:22px;
    height:22px;
    border-radius:50%;
    border:2px solid var(--outline);
}

.hold-dot .dot-name{
    font-size:.75rem;
    font-weight:700;
    color:var(--light-gray);
}

.hold-dot.ready{
    background:#2ecc71;
}

.hold-dot.ready .dot-name{
    color:#000;
}

/* Bottom text */
.bottom-text{
    font-weight:700;
    color:var(--light-gray);
    text-transform:uppercase;
}

/* Winner overlay */
.winner-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.85);
    display:none;
    align-items:center;
    justify-content:center;
}

.winner-overlay.show{
    display:flex;
}

.winner-card{
    background:#222;
    padding:30px;
    border:6px solid var(--outline);
    border-radius:20px;
    text-align:center;
}

.winner-avatar{
    width:120px;
    height:120px;
    border-radius:50%;
    border:6px solid var(--gold);
    margin-bottom:20px;
}

.winner-label{
    font-size:2rem;
    font-weight:700;
    margin-bottom:8px;
}

.winner-subtitle{
    color:var(--red);
    font-weight:700;
    margin-bottom:30px;
}

/* Buttons */
.btn{
    padding:14px 28px;
    border:4px solid var(--outline);
    border-radius:12px;
    font-weight:700;
    background:#444;
    color:white;
    cursor:pointer;
}

.btn-gold{
    background:var(--gold);
    color:#000;
}

.btn:active{
    transform:scale(.95);
}
</style>
</head>
<body>

<div class="app" id="app"></div>
<div class="winner-overlay" id="winnerOverlay">
    <div class="winner-card" id="winnerCard"></div>
</div>
