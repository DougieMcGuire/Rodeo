<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RODEO Roulette</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#ffefc2;
    --black:#000;
    --red:#ff3b30;
    --yellow:#ffd400;
    --blue:#3fa7ff;
    --green:#2ecc71;
}

body{
    font-family:'Fredoka',sans-serif;
    background:var(--bg);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.app{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
    width:100%;
}

.hover-name{
    font-size:1.5rem;
    font-weight:700;
    padding:8px 18px;
    background:white;
    border:4px solid black;
    border-radius:14px;
    min-height:48px;
}

.wheel-wrapper{
    position:relative;
    width:320px;
    height:320px;
}

.wheel-outer{
    width:100%;
    height:100%;
    border-radius:50%;
    border:8px solid black;
    overflow:hidden;
    background:white;
}

canvas{
    width:100%;
    height:100%;
}

.ticker{
    position:absolute;
    top:-18px;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:18px solid transparent;
    border-right:18px solid transparent;
    border-top:36px solid red;
}

.bottom-text{
    font-weight:700;
    font-size:1rem;
}

.btn{
    padding:14px 28px;
    font-weight:700;
    border:4px solid black;
    border-radius:12px;
    cursor:pointer;
    background:var(--yellow);
}

.btn:active{
    transform:scale(.95);
}

.winner-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    display:none;
    justify-content:center;
    align-items:center;
}

.winner-card{
    background:white;
    padding:30px;
    border:6px solid black;
    border-radius:20px;
    text-align:center;
}

.winner-avatar{
    width:110px;
    height:110px;
    border-radius:50%;
    border:6px solid black;
    margin-bottom:15px;
}
</style>
</head>

<body>

<div class="app" id="app"></div>

<div class="winner-overlay" id="winnerOverlay">
    <div class="winner-card" id="winnerCard"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyBaJXCqGmUaGumvcWNE7w4FOOzTJVDH-yg",
    authDomain: "polorfriends.firebaseapp.com",
    databaseURL: "https://polorfriends-default-rtdb.firebaseio.com",
    projectId: "polorfriends",
    storageBucket: "polorfriends.firebasestorage.app",
    messagingSenderId: "328546525972",
    appId: "1:328546525972:web:a6fe0f0a45b4565a7b1801"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();

function getPlayerData(){ return JSON.parse(localStorage.getItem('playerData')); }
function getCurrentRoom(){ return localStorage.getItem('currentRoom'); }

const roomCode = new URLSearchParams(window.location.search).get('room') || getCurrentRoom();
const playerData = getPlayerData();
if(!roomCode || !playerData) location.href='index.html';

let players=[];
let isHost=false;
let wheelCtx,wheelSize,currentRotation=0,anim;

const COLORS=['#ff595e','#ffca3a','#8ac926','#1982c4','#6a4c93'];

const app=document.getElementById('app');

database.ref('rooms/'+roomCode).once('value',snap=>{
    const room=snap.val();
    isHost=(room.hostId===playerData.playerId);

    database.ref('rooms/'+roomCode+'/players').once('value',snap=>{
        players=Object.values(snap.val());
        if(isHost){
            database.ref('rooms/'+roomCode+'/rouletteState').set({
                phase:'waiting',
                winnerId:null,
                rotation:0
            });
        }
        listenState();
    });
});

function listenState(){
    database.ref('rooms/'+roomCode+'/rouletteState').on('value',snap=>{
        const state=snap.val();
        if(state.phase==='waiting') buildWaiting();
        if(state.phase==='spinning') spin(state.rotation);
        if(state.phase==='result') showResult(state.winnerId);
    });
}

function buildWaiting(){
    app.innerHTML=`
        <div class="hover-name" id="hoverName">Ready?</div>
        <div class="wheel-wrapper">
            <div class="ticker"></div>
            <div class="wheel-outer">
                <canvas id="wheelCanvas"></canvas>
            </div>
        </div>
        <button class="btn" onclick="startSpin()">SPIN</button>
    `;
    initCanvas();
    drawWheel(0);
}

function initCanvas(){
    const canvas=document.getElementById('wheelCanvas');
    wheelSize=320;
    canvas.width=wheelSize;
    canvas.height=wheelSize;
    wheelCtx=canvas.getContext('2d');
}

function drawWheel(rotation){
    const n=players.length;
    const slice=2*Math.PI/n;
    const r=wheelSize/2;

    wheelCtx.clearRect(0,0,wheelSize,wheelSize);
    wheelCtx.save();
    wheelCtx.translate(r,r);
    wheelCtx.rotate(rotation*Math.PI/180);

    for(let i=0;i<n;i++){
        wheelCtx.beginPath();
        wheelCtx.moveTo(0,0);
        wheelCtx.arc(0,0,r,i*slice,i*slice+slice);
        wheelCtx.fillStyle=COLORS[i%COLORS.length];
        wheelCtx.fill();
        wheelCtx.strokeStyle='black';
        wheelCtx.lineWidth=4;
        wheelCtx.stroke();

        wheelCtx.save();
        wheelCtx.rotate(i*slice+slice/2);
        wheelCtx.fillStyle='black';
        wheelCtx.font='bold 14px Fredoka';
        wheelCtx.textAlign='right';
        wheelCtx.fillText(players[i].name,r-15,5);
        wheelCtx.restore();
    }
    wheelCtx.restore();
}

function startSpin(){
    if(!isHost) return;

    const winner=players[Math.floor(Math.random()*players.length)];
    const idx=players.indexOf(winner);
    const segment=360/players.length;
    const finalRotation=1440+(360-(idx*segment+segment/2));

    database.ref('rooms/'+roomCode+'/rouletteState').update({
        phase:'spinning',
        winnerId:winner.playerId,
        rotation:finalRotation
    });

    setTimeout(()=>{
        database.ref('rooms/'+roomCode+'/rouletteState').update({
            phase:'result'
        });
    },2000);
}

function spin(target){
    const start=performance.now();
    const duration=1800;

    function animate(t){
        const progress=Math.min((t-start)/duration,1);
        const eased=1-Math.pow(1-progress,3);
        currentRotation=target*eased;
        drawWheel(currentRotation);

        if(progress<1) anim=requestAnimationFrame(animate);
    }
    anim=requestAnimationFrame(animate);
}

function showResult(id){
    const winner=players.find(p=>p.playerId===id);
    const overlay=document.getElementById('winnerOverlay');
    const card=document.getElementById('winnerCard');

    card.innerHTML=`
        <img src="${winner.avatarUrl}" class="winner-avatar">
        <h2>${winner.name}</h2>
        <button class="btn" onclick="resetGame()">SPIN AGAIN</button>
    `;

    overlay.style.display='flex';
}

function resetGame(){
    if(isHost){
        database.ref('rooms/'+roomCode+'/rouletteState').update({
            phase:'waiting',
            winnerId:null,
            rotation:0
        });
    }
    document.getElementById('winnerOverlay').style.display='none';
}
</script>

</body>
</html>
