<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Polar Stack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow:hidden;background:#0a1628;font-family:'Fredoka',sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;width:100%;height:100%;position:fixed;top:0;left:0}
canvas#game{display:block;position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:1;touch-action:manipulation}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;display:none;align-items:center;justify-content:center;background:rgba(10,22,40,.88);backdrop-filter:blur(8px)}
.overlay.active{display:flex}
.panel{background:linear-gradient(145deg,#1a2d4a,#0f1f38);border:2px solid rgba(255,255,255,.12);border-radius:24px;padding:36px 32px;text-align:center;max-width:380px;width:90%;box-shadow:0 25px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08);animation:panelIn .3s ease-out}
@keyframes panelIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.panel h1{font-family:'Lilita One',cursive;font-size:36px;color:#fff;margin-bottom:6px;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.panel h2{font-family:'Lilita One',cursive;font-size:28px;color:#FFD700;margin-bottom:4px}
.panel .subtitle{color:rgba(255,255,255,.5);font-size:13px;margin-bottom:24px;letter-spacing:1.5px}
.panel .final-score{font-family:'Lilita One',cursive;font-size:64px;color:#fff;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.3),0 0 40px rgba(255,215,0,.2)}
.panel .new-best{display:inline-block;background:linear-gradient(135deg,#FFD700,#FFA500);color:#1a1a1a;font-weight:700;font-size:12px;padding:4px 14px;border-radius:20px;margin-top:8px;letter-spacing:1px}
.panel .stats-row{display:flex;justify-content:center;gap:32px;margin:20px 0}
.panel .stat{text-align:center}
.panel .stat-val{font-family:'Lilita One',cursive;font-size:24px;color:#7EC8E3}
.panel .stat-label{font-size:11px;color:rgba(255,255,255,.4);letter-spacing:1px;margin-top:2px}
.btn{display:inline-block;padding:14px 40px;border-radius:16px;border:none;font-family:'Fredoka',sans-serif;font-weight:700;font-size:18px;cursor:pointer;transition:all .15s;margin:6px;pointer-events:auto}
.btn:active{transform:scale(.95)!important}
.btn-primary{background:linear-gradient(135deg,#4FC3F7,#29B6F6);color:#fff;box-shadow:0 4px 0 #0288D1,0 8px 20px rgba(79,195,247,.3)}
.btn-primary:hover{transform:translateY(-2px)}
.btn-secondary{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.15)}
.btn-secondary:hover{background:rgba(255,255,255,.18)}
.bear-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}
.bear-card{background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.1);border-radius:16px;padding:14px 8px 10px;cursor:pointer;transition:all .2s;position:relative}
.bear-card:hover{background:rgba(255,255,255,.1);transform:translateY(-2px)}
.bear-card.selected{border-color:#FFD700;background:rgba(255,215,0,.1);box-shadow:0 0 20px rgba(255,215,0,.15)}
.bear-card.locked{opacity:.4;cursor:default}
.bear-card.locked:hover{transform:none;background:rgba(255,255,255,.06)}
.bear-card canvas{display:block;margin:0 auto 6px}
.bear-card .bear-name{font-size:11px;color:#fff;font-weight:600}
.bear-card .bear-unlock{font-size:9px;color:rgba(255,215,0,.7);margin-top:2px}
.bear-card .lock-icon{position:absolute;top:6px;right:6px;font-size:12px}
.unlock-toast{position:fixed;top:-100px;left:50%;transform:translateX(-50%);z-index:99999;background:linear-gradient(135deg,#1a2d4a,#0f1f38);border:2px solid #FFD700;border-radius:18px;padding:16px 28px;display:flex;align-items:center;gap:14px;box-shadow:0 10px 40px rgba(0,0,0,.5),0 0 30px rgba(255,215,0,.2);transition:top .6s cubic-bezier(.17,.89,.32,1.49)}
.unlock-toast.show{top:24px}
.unlock-toast canvas{flex-shrink:0}
.unlock-toast .toast-text h3{font-family:'Lilita One',cursive;color:#FFD700;font-size:16px}
.unlock-toast .toast-text p{color:rgba(255,255,255,.7);font-size:12px}
.tap-hint{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);z-index:5;color:rgba(255,255,255,.45);font-size:15px;letter-spacing:3px;font-weight:600;animation:tapPulse 2s ease-in-out infinite;pointer-events:none;display:none}
@keyframes tapPulse{0%,100%{opacity:.25;transform:translateX(-50%) translateY(0)}50%{opacity:.6;transform:translateX(-50%) translateY(-6px)}}
.hud-bear-btn{position:fixed;bottom:20px;left:20px;z-index:50}
.hud-bear-btn button{background:rgba(255,255,255,.12);backdrop-filter:blur(10px);border:2px solid rgba(255,255,255,.2);border-radius:14px;padding:10px 16px;color:#fff;font-family:'Fredoka',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;pointer-events:auto}
.hud-bear-btn button:hover{background:rgba(255,255,255,.22);transform:scale(1.05)}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="tap-hint" id="tapHint">TAP ANYWHERE TO DROP</div>
<div class="hud-bear-btn"><button onclick="G.openBears()">🐻 Bears</button></div>

<div class="overlay active" id="startOverlay"><div class="panel">
  <h1>🐻‍❄️ POLAR STACK</h1>
  <div class="subtitle">STACK ICE BLOCKS · DON'T FALL</div>
  <div style="margin:24px 0 8px"><button class="btn btn-primary" onclick="G.start()">PLAY</button></div>
  <button class="btn btn-secondary" onclick="G.openBears()">🐻 Choose Bear</button>
</div></div>

<div class="overlay" id="gameOverOverlay"><div class="panel">
  <h2>GAME OVER</h2>
  <div class="final-score" id="finalScore">0</div>
  <div id="newBestBadge" style="display:none"><span class="new-best">✨ NEW BEST!</span></div>
  <div class="stats-row">
    <div class="stat"><div class="stat-val" id="statBlocks">0</div><div class="stat-label">BLOCKS</div></div>
    <div class="stat"><div class="stat-val" id="statCombo">0</div><div class="stat-label">BEST COMBO</div></div>
    <div class="stat"><div class="stat-val" id="statPerfects">0</div><div class="stat-label">PERFECTS</div></div>
  </div>
  <button class="btn btn-primary" onclick="G.start()">PLAY AGAIN</button>
  <button class="btn btn-secondary" onclick="G.openBears()">🐻 Bears</button>
</div></div>

<div class="overlay" id="bearOverlay"><div class="panel" style="max-width:420px">
  <h2>🐻 Choose Your Bear</h2>
  <div class="subtitle">UNLOCK MORE BY SCORING HIGHER</div>
  <div class="bear-grid" id="bearGrid"></div>
  <button class="btn btn-primary" onclick="G.closeBears()">DONE</button>
</div></div>

<div class="unlock-toast" id="unlockToast">
  <canvas id="toastBearCanvas" width="50" height="50"></canvas>
  <div class="toast-text"><h3 id="toastTitle"></h3><p id="toastSub"></p></div>
</div>

<script>
var SS={_m:{},get:function(k){try{return localStorage.getItem(k)}catch(e){return this._m[k]||null}},set:function(k,v){this._m[k]=String(v);try{localStorage.setItem(k,v)}catch(e){}}};
var G={};

(function(){
  var canvas=document.getElementById('game'),ctx=canvas.getContext('2d');

  // ---- CONSTANTS ----
  var BLOCK_H=48;
  var PERF_T=18,BASE_SPD=1.6,SPD_INC=.1,SPD_INT=8,MAX_SPD=4.5;
  var NARROW=70,GRAV=.6,MIN_W=40;
  var MAGNET=22;

  var BEARS=[
    {id:'bear1',name:'Polar Bear',unlock:0,body:'#F5F5F5',belly:'#E0E0E0',nose:'#2C2C2C',ear:'#FFB6C1',cheek:'rgba(255,182,193,.4)'},
    {id:'bear2',name:'Panda',unlock:50,body:'#FFFFFF',belly:'#E8E8E8',nose:'#1a1a1a',ear:'#1a1a1a',cheek:'rgba(255,182,193,.3)',patches:1,patchCol:'#1a1a1a'},
    {id:'bear3',name:'Grizzly',unlock:150,body:'#8B6F47',belly:'#C4A882',nose:'#3D2B1F',ear:'#6B4F32',cheek:'rgba(139,111,71,.3)'},
    {id:'bear4',name:'Black Bear',unlock:300,body:'#2C2C2C',belly:'#4A4A4A',nose:'#1a1a1a',ear:'#3D3D3D',cheek:'rgba(80,80,80,.3)',dark:1},
    {id:'bear5',name:'Koala',unlock:500,body:'#8E8E8E',belly:'#C4C4C4',nose:'#2C2C2C',ear:'#D4A8B0',cheek:'rgba(180,140,160,.4)',bigN:1,fluf:1},
    {id:'bear6',name:'Teddy',unlock:1000,body:'#D2691E',belly:'#F4C98A',nose:'#8B4513',ear:'#F4C98A',cheek:'rgba(244,201,138,.4)',heart:1}
  ];

  var W,H,dpr,blocks=[],cur=null,score=0,hi=0,combo=0,maxC=0,perfects=0,blockN=0;
  var spd=BASE_SPD,dir=1,camY=0,tCamY=0,running=false;
  var selBear='bear1',unlocked=['bear1'];
  var parts=[],shake=0,flash=0,falling=null,stars=[],t=0;
  // Bear jump state
  var bearY=0,bearVY=0,bearJumping=false;
  // Floating score texts
  var floatTexts=[];
  // Combo display
  var comboShow=0,comboText='',comboSub='';

  function resize(){
    dpr=window.devicePixelRatio||1;W=window.innerWidth;H=window.innerHeight;
    canvas.width=W*dpr;canvas.height=H*dpr;
    canvas.style.width=W+'px';canvas.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize',resize);resize();

  function load(){
    hi=parseInt(SS.get('polarStackHighScore'))||0;
    selBear=SS.get('polarStackSelectedBear')||'bear1';
    try{var s=SS.get('polarStackUnlocked');unlocked=s?JSON.parse(s):['bear1'];}catch(e){unlocked=['bear1'];}
    if(unlocked.indexOf('bear1')<0)unlocked.push('bear1');
  }
  function save(){
    SS.set('polarStackHighScore',hi);
    SS.set('polarStackSelectedBear',selBear);
    SS.set('polarStackUnlocked',JSON.stringify(unlocked));
  }

  function mkStars(){stars=[];for(var i=0;i<80;i++)stars.push({x:Math.random()*2000,y:Math.random()*5000,r:Math.random()*2+.4,tw:Math.random()*Math.PI*2,sp:Math.random()*.5+.5});}

  // ---- BEAR DRAWING ----
  function dHeart(c,cx,cy,s){c.fillStyle='#E74C3C';c.save();c.translate(cx,cy);c.beginPath();c.moveTo(0,s*.3);c.bezierCurveTo(-s,-s*.3,-s*.5,-s,0,-s*.4);c.bezierCurveTo(s*.5,-s,s,-s*.3,0,s*.3);c.fill();c.restore();}

  function dBear(c,id,x,y,w,h,st){
    var d=BEARS[0];for(var i=0;i<BEARS.length;i++)if(BEARS[i].id===id){d=BEARS[i];break;}
    c.save();
    if(st){
      var bw=w*.7,bh=h,bx=x+(w-bw)/2,by=y;
      c.fillStyle=d.body;
      c.beginPath();c.ellipse(bx+bw/2,by+bh*.55,bw*.42,bh*.45,0,0,Math.PI*2);c.fill();
      c.beginPath();c.arc(bx+bw/2,by+bh*.18,bw*.35,0,Math.PI*2);c.fill();
      c.beginPath();c.arc(bx+bw*.28,by+bh*.05,bw*.14,0,Math.PI*2);c.fill();
      c.beginPath();c.arc(bx+bw*.72,by+bh*.05,bw*.14,0,Math.PI*2);c.fill();
      c.fillStyle=d.ear;
      c.beginPath();c.arc(bx+bw*.28,by+bh*.05,bw*.07,0,Math.PI*2);c.fill();
      c.beginPath();c.arc(bx+bw*.72,by+bh*.05,bw*.07,0,Math.PI*2);c.fill();
      c.fillStyle=d.belly;
      c.beginPath();c.ellipse(bx+bw/2,by+bh*.58,bw*.28,bh*.25,0,0,Math.PI*2);c.fill();
      if(d.heart)dHeart(c,bx+bw/2,by+bh*.52,bw*.12);
      if(d.patches){c.fillStyle=d.patchCol;c.beginPath();c.ellipse(bx+bw*.35,by+bh*.16,bw*.12,bh*.06,-.2,0,Math.PI*2);c.fill();c.beginPath();c.ellipse(bx+bw*.65,by+bh*.16,bw*.12,bh*.06,.2,0,Math.PI*2);c.fill();}
      var ey=by+bh*.16,es=bw*.13;
      c.fillStyle=d.dark?'#FFF':'#1a1a1a';
      c.beginPath();c.arc(bx+bw/2-es,ey,bw*.055,0,Math.PI*2);c.fill();
      c.beginPath();c.arc(bx+bw/2+es,ey,bw*.055,0,Math.PI*2);c.fill();
      if(d.dark){c.fillStyle='#1a1a1a';c.beginPath();c.arc(bx+bw/2-es,ey,bw*.03,0,Math.PI*2);c.fill();c.beginPath();c.arc(bx+bw/2+es,ey,bw*.03,0,Math.PI*2);c.fill();}
      c.fillStyle='#fff';c.beginPath();c.arc(bx+bw/2-es+2,ey-2,bw*.02,0,Math.PI*2);c.fill();c.beginPath();c.arc(bx+bw/2+es+2,ey-2,bw*.02,0,Math.PI*2);c.fill();
      c.fillStyle=d.nose;c.beginPath();c.ellipse(bx+bw/2,by+bh*.22,bw*(d.bigN?.09:.06),bw*(d.bigN?.063:.042),0,0,Math.PI*2);c.fill();
      c.fillStyle=d.cheek;c.beginPath();c.arc(bx+bw*.3,by+bh*.22,bw*.06,0,Math.PI*2);c.fill();c.beginPath();c.arc(bx+bw*.7,by+bh*.22,bw*.06,0,Math.PI*2);c.fill();
      c.fillStyle=d.body;var aw=Math.sin(t*5)*.15;
      c.save();c.translate(bx+bw*.15,by+bh*.42);c.rotate(-.6+aw);c.beginPath();c.ellipse(0,0,bw*.1,bh*.1,0,0,Math.PI*2);c.fill();c.restore();
      c.save();c.translate(bx+bw*.85,by+bh*.42);c.rotate(.6-aw);c.beginPath();c.ellipse(0,0,bw*.1,bh*.1,0,0,Math.PI*2);c.fill();c.restore();
      c.beginPath();c.ellipse(bx+bw*.35,by+bh*.95,bw*.14,bh*.06,0,0,Math.PI*2);c.fill();
      c.beginPath();c.ellipse(bx+bw*.65,by+bh*.95,bw*.14,bh*.06,0,0,Math.PI*2);c.fill();
    } else {
      var bw=w,bh=h,bx=x,by=y;
      c.fillStyle=d.body;
      c.beginPath();c.ellipse(bx+bw/2,by+bh*.6,bw*.46,bh*.42,0,0,Math.PI*2);c.fill();
      c.beginPath();c.arc(bx+bw/2,by+bh*.25,bw*.34,0,Math.PI*2);c.fill();
      c.beginPath();c.arc(bx+bw*.25,by+bh*.08,bw*.12,0,Math.PI*2);c.fill();
      c.beginPath();c.arc(bx+bw*.75,by+bh*.08,bw*.12,0,Math.PI*2);c.fill();
      c.fillStyle=d.ear;
      c.beginPath();c.arc(bx+bw*.25,by+bh*.08,bw*.06,0,Math.PI*2);c.fill();
      c.beginPath();c.arc(bx+bw*.75,by+bh*.08,bw*.06,0,Math.PI*2);c.fill();
      if(d.fluf){c.fillStyle=d.body;c.beginPath();c.arc(bx+bw*.2,by+bh*.07,bw*.17,0,Math.PI*2);c.fill();c.beginPath();c.arc(bx+bw*.8,by+bh*.07,bw*.17,0,Math.PI*2);c.fill();c.fillStyle=d.ear;c.beginPath();c.arc(bx+bw*.2,by+bh*.07,bw*.09,0,Math.PI*2);c.fill();c.beginPath();c.arc(bx+bw*.8,by+bh*.07,bw*.09,0,Math.PI*2);c.fill();}
      c.fillStyle=d.belly;c.beginPath();c.ellipse(bx+bw/2,by+bh*.62,bw*.3,bh*.28,0,0,Math.PI*2);c.fill();
      if(d.heart)dHeart(c,bx+bw/2,by+bh*.55,bw*.1);
      if(d.patches){c.fillStyle=d.patchCol;c.beginPath();c.ellipse(bx+bw*.35,by+bh*.22,bw*.13,bh*.07,-.2,0,Math.PI*2);c.fill();c.beginPath();c.ellipse(bx+bw*.65,by+bh*.22,bw*.13,bh*.07,.2,0,Math.PI*2);c.fill();}
      var ey=by+bh*.22,es=bw*.12;
      c.fillStyle=d.dark?'#FFF':'#1a1a1a';
      c.beginPath();c.arc(bx+bw/2-es,ey,bw*.05,0,Math.PI*2);c.fill();
      c.beginPath();c.arc(bx+bw/2+es,ey,bw*.05,0,Math.PI*2);c.fill();
      if(d.dark){c.fillStyle='#1a1a1a';c.beginPath();c.arc(bx+bw/2-es,ey,bw*.025,0,Math.PI*2);c.fill();c.beginPath();c.arc(bx+bw/2+es,ey,bw*.025,0,Math.PI*2);c.fill();}
      c.fillStyle='#fff';c.beginPath();c.arc(bx+bw/2-es+2,ey-2,bw*.018,0,Math.PI*2);c.fill();c.beginPath();c.arc(bx+bw/2+es+2,ey-2,bw*.018,0,Math.PI*2);c.fill();
      c.strokeStyle=d.nose;c.lineWidth=1.5;c.beginPath();c.arc(bx+bw/2,by+bh*.3,bw*.06,.1,Math.PI-.1);c.stroke();
      c.fillStyle=d.nose;c.beginPath();c.ellipse(bx+bw/2,by+bh*.28,bw*(d.bigN?.08:.055),bw*(d.bigN?.056:.038),0,0,Math.PI*2);c.fill();
      c.fillStyle=d.cheek;c.beginPath();c.arc(bx+bw*.3,by+bh*.28,bw*.055,0,Math.PI*2);c.fill();c.beginPath();c.arc(bx+bw*.7,by+bh*.28,bw*.055,0,Math.PI*2);c.fill();
      c.fillStyle=d.body;
      c.beginPath();c.ellipse(bx+bw*.12,by+bh*.55,bw*.1,bh*.12,-.3,0,Math.PI*2);c.fill();
      c.beginPath();c.ellipse(bx+bw*.88,by+bh*.55,bw*.1,bh*.12,.3,0,Math.PI*2);c.fill();
      c.beginPath();c.ellipse(bx+bw*.32,by+bh*.92,bw*.13,bh*.08,-.2,0,Math.PI*2);c.fill();
      c.beginPath();c.ellipse(bx+bw*.68,by+bh*.92,bw*.13,bh*.08,.2,0,Math.PI*2);c.fill();
    }
    c.restore();
  }

  // ---- BLOCK COLORS - ice/snow palette ----
  function bCol(i){
    // Cycle through cool icy hues
    var hues=[195,200,205,210,190,185,215,220,188,198];
    var h=hues[i%hues.length];
    var lShift=(i%5)*2;
    return{h:h,s:55+((i*3)%20),l:72+lShift};
  }
  function hsl(c,o){return 'hsl('+c.h+','+c.s+'%,'+(c.l+(o||0))+'%)';}

  function startW(){return Math.min(260,W*.48);}

  function init(){
    var sw=startW();
    var startY=H-70-BLOCK_H;
    blocks=[{x:W/2-sw/2,y:startY,width:sw,height:BLOCK_H,color:bCol(0)}];
    cur=null;score=0;combo=0;maxC=0;perfects=0;blockN=0;
    spd=BASE_SPD;dir=1;
    // Camera starts centered on the base block
    tCamY=startY-H*.55;camY=tCamY;
    parts=[];shake=0;flash=0;falling=null;
    bearY=0;bearVY=0;bearJumping=false;
    floatTexts=[];comboShow=0;
    spawn();
  }

  function spawn(){
    var prev=blocks[blocks.length-1];
    var ny=prev.y-BLOCK_H; // blocks stack flush, no gap
    dir=blocks.length%2===0?1:-1;
    cur={x:dir===1?-prev.width:W,y:ny,width:prev.width,height:BLOCK_H,color:bCol(blocks.length),moving:true};
    // Bear jumps when new block appears
    if(blocks.length>1){
      bearVY=-15;
      bearJumping=true;
    }
  }

  function place(){
    if(!cur||!cur.moving||!running)return;
    cur.moving=false;
    var prev=blocks[blocks.length-1];

    // Magnetic snap — if close to aligned, snap it
    var cd=Math.abs((cur.x+cur.width/2)-(prev.x+prev.width/2));
    if(cd<MAGNET){
      cur.x=prev.x+(prev.width-cur.width)/2;
      cd=0;
    }

    var os=Math.max(cur.x,prev.x);
    var oe=Math.min(cur.x+cur.width,prev.x+prev.width);
    var ow=oe-os;
    if(ow<=0){falling={x:cur.x,y:cur.y,width:cur.width,height:BLOCK_H,color:cur.color,velY:0};cur=null;endGame();return;}
    var perf=cd<PERF_T;
    blockN++;
    var tl=cur.x<prev.x?prev.x-cur.x:0;
    var tr=(cur.x+cur.width)>(prev.x+prev.width)?(cur.x+cur.width)-(prev.x+prev.width):0;
    if(!perf&&(tl>3||tr>3)){var tx=tl>tr?cur.x:oe;falling={x:tx,y:cur.y,width:Math.max(tl,tr),height:BLOCK_H,color:cur.color,velY:0};}
    if(perf){
      cur.x=prev.x;cur.width=prev.width;
      combo++;if(combo>maxC)maxC=combo;perfects++;
      var bonus=10+combo*5;score+=bonus;
      mkParts(cur.x+cur.width/2,cur.y,24,'#FFD700');
      mkParts(cur.x+cur.width/2,cur.y,12,'#FFFFFF');
      shake=8;flash=.18;
      comboText=combo>=3?combo+'× COMBO!':'PERFECT!';
      comboSub='+'+bonus;
      comboShow=1;
      addFloat('+'+bonus,cur.x+cur.width/2,cur.y,'#FFD700',28);
    } else {
      // Enforce minimum block width so game stays playable
      if(ow<MIN_W&&ow>0){
        var center=os+ow/2;
        cur.width=MIN_W;
        cur.x=center-MIN_W/2;
      } else {
        cur.x=os;cur.width=ow;
      }
      combo=0;score+=5;
      addFloat('+5',cur.x+cur.width/2,cur.y,'#FFFFFF',20);
    }
    blocks.push({x:cur.x,y:cur.y,width:cur.width,height:BLOCK_H,color:cur.color});
    // Land bear on new block
    bearY=0;bearVY=0;bearJumping=false;

    // Camera always centers the top block at middle of screen
    tCamY=cur.y-H*.55;
    if(blockN%SPD_INT===0&&spd<MAX_SPD)spd+=SPD_INC;
    chkUnlock();
    spawn();
  }

  function addFloat(txt,x,y,col,sz){
    floatTexts.push({txt:txt,x:x,y:y,col:col,sz:sz,a:1,vy:-2});
  }

  function endGame(){
    running=false;
    var isNew=score>hi;
    if(isNew){hi=score;}
    save();
    setTimeout(function(){
      document.getElementById('finalScore').textContent=score;
      document.getElementById('statBlocks').textContent=blockN;
      document.getElementById('statCombo').textContent=maxC;
      document.getElementById('statPerfects').textContent=perfects;
      document.getElementById('newBestBadge').style.display=isNew?'block':'none';
      document.getElementById('gameOverOverlay').classList.add('active');
    },700);
  }

  function mkParts(x,y,n,col){for(var i=0;i<n;i++)parts.push({x:x,y:y,vx:(Math.random()-.5)*10,vy:-Math.random()*8-2,r:Math.random()*4+1.5,c:col,a:1,g:.15});}

  function chkUnlock(){
    for(var i=0;i<BEARS.length;i++){var b=BEARS[i];
      if(score>=b.unlock&&unlocked.indexOf(b.id)<0){
        unlocked.push(b.id);save();
        var tc=document.getElementById('toastBearCanvas').getContext('2d');
        tc.clearRect(0,0,50,50);dBear(tc,b.id,5,2,40,46,false);
        document.getElementById('toastTitle').textContent=b.name+' Unlocked!';
        document.getElementById('toastSub').textContent='Score '+b.unlock+'+ reached';
        var toast=document.getElementById('unlockToast');
        toast.classList.add('show');setTimeout(function(){toast.classList.remove('show');},3500);
      }
    }
  }

  // ---- RENDERING ----
  function drawBG(){
    var g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#060E1A');g.addColorStop(.3,'#0C1B33');g.addColorStop(.6,'#15294D');g.addColorStop(1,'#1E3A5F');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    // Aurora shimmer
    ctx.globalAlpha=.04;
    for(var i=0;i<3;i++){
      var ag=ctx.createRadialGradient(W*(.2+i*.3)+Math.sin(t*.2+i*2)*100,H*.15+Math.sin(t*.15+i)*30,0,W*(.2+i*.3),H*.15,W*.35);
      ag.addColorStop(0,['#4FC3F7','#81C784','#CE93D8'][i]);ag.addColorStop(1,'transparent');
      ctx.fillStyle=ag;ctx.fillRect(0,0,W,H);
    }
    ctx.globalAlpha=1;
    // Stars parallax
    for(var i=0;i<stars.length;i++){
      var s=stars[i];
      var a=.2+Math.sin(t*s.sp+s.tw)*.3;
      var sy=(s.y+camY*.05)%(H*2);
      var sx=s.x%W;
      ctx.fillStyle='rgba(255,255,255,'+a+')';
      ctx.beginPath();ctx.arc(sx,sy,s.r,0,Math.PI*2);ctx.fill();
    }
  }

  function drawBlk(b,yo,idx){
    var x=b.x,y=b.y-yo,w=b.width,h=b.height,c=b.color;
    // Main block - seamless, no border
    var g=ctx.createLinearGradient(x,y,x+w,y);
    g.addColorStop(0,hsl(c,-3));
    g.addColorStop(.3,hsl(c,4));
    g.addColorStop(.7,hsl(c,6));
    g.addColorStop(1,hsl(c,-2));
    ctx.fillStyle=g;
    ctx.fillRect(x,y,w,h);

    // Top highlight - subtle shine
    var tg=ctx.createLinearGradient(x,y,x,y+h*.3);
    tg.addColorStop(0,'rgba(255,255,255,.18)');
    tg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=tg;
    ctx.fillRect(x,y,w,h*.3);

    // Small ice shimmer spots
    ctx.fillStyle='rgba(255,255,255,.15)';
    var shimX=((idx||0)*37+13)%100/100;
    ctx.fillRect(x+w*shimX,y+4,Math.min(w*.15,20),2);
    ctx.fillRect(x+w*((shimX+.4)%1),y+6,Math.min(w*.1,12),2);

    // Very subtle side edge (not a border, just depth)
    ctx.fillStyle='rgba(0,0,0,.06)';
    ctx.fillRect(x,y,1,h);
    ctx.fillRect(x+w-1,y,1,h);
  }

  // Draw the score HUD on canvas (mobile-game style, above the action)
  function drawHUD(yo){
    // Score centered near top
    ctx.textAlign='center';
    ctx.textBaseline='top';

    // Main score - big and bold
    ctx.font='700 56px "Lilita One", cursive';
    ctx.fillStyle='rgba(0,0,0,.2)';
    ctx.fillText(score,W/2,24);
    ctx.fillStyle='#FFFFFF';
    ctx.fillText(score,W/2,22);

    // Best score underneath
    ctx.font='600 14px "Fredoka", sans-serif';
    ctx.fillStyle='rgba(255,255,255,.4)';
    ctx.fillText('BEST: '+hi,W/2,80);

    // Combo popup
    if(comboShow>0){
      comboShow-=.015;
      var cs=Math.min(1,comboShow*3);
      var cy_offset=Math.max(0,(1-comboShow)*40);
      ctx.globalAlpha=cs;
      ctx.font='700 38px "Lilita One", cursive';
      ctx.fillStyle='#FFD700';
      ctx.shadowColor='rgba(255,215,0,.5)';ctx.shadowBlur=20;
      ctx.fillText(comboText,W/2,110-cy_offset);
      ctx.shadowBlur=0;
      ctx.font='600 16px "Fredoka", sans-serif';
      ctx.fillStyle='rgba(255,255,255,.8)';
      ctx.fillText(comboSub,W/2,150-cy_offset);
      ctx.globalAlpha=1;
    }

    // Floating score texts
    for(var i=floatTexts.length-1;i>=0;i--){
      var ft=floatTexts[i];
      ft.y+=ft.vy;ft.vy*=.98;ft.a-=.015;
      if(ft.a<=0){floatTexts.splice(i,1);continue;}
      ctx.globalAlpha=ft.a;
      ctx.font='700 '+ft.sz+'px "Lilita One", cursive';
      ctx.fillStyle=ft.col;
      ctx.fillText(ft.txt,ft.x,ft.y-yo);
    }
    ctx.globalAlpha=1;
    ctx.textAlign='start';
  }

  function loop(){
    t+=.016;
    var sx=0,sy=0;
    if(shake>0){sx=(Math.random()-.5)*shake;sy=(Math.random()-.5)*shake;shake*=.82;if(shake<.3)shake=0;}
    camY+=(tCamY-camY)*.1;
    var yo=camY;

    ctx.save();ctx.translate(sx,sy);
    drawBG();

    // Ground - extends far below
    var gy=H-70-yo;
    var groundTop=Math.min(gy,H);
    var gg=ctx.createLinearGradient(0,groundTop-20,0,groundTop+200);
    gg.addColorStop(0,'#2A5470');gg.addColorStop(.3,'#1E3D55');gg.addColorStop(1,'#142B3D');
    ctx.fillStyle=gg;ctx.fillRect(0,groundTop-20,W,H-groundTop+220);
    // Snow surface
    if(gy>-5&&gy<H+5){ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(0,gy,W,2);}

    // Draw all stacked blocks (bottom to top, seamless)
    for(var i=0;i<blocks.length;i++) drawBlk(blocks[i],yo,i);

    // Current sliding block
    if(cur) drawBlk(cur,yo,blocks.length);

    // Falling trim piece
    if(falling){
      falling.velY+=.6;falling.y+=falling.velY;
      // Rotate as it falls
      if(falling.y-yo<H+100){
        ctx.save();
        var fcx=falling.x+falling.width/2,fcy=falling.y-yo+BLOCK_H/2;
        ctx.translate(fcx,fcy);
        ctx.rotate(falling.velY*.02);
        ctx.translate(-fcx,-fcy);
        ctx.globalAlpha=Math.max(0,1-(falling.y-yo)/H);
        drawBlk(falling,yo,99);
        ctx.globalAlpha=1;
        ctx.restore();
      } else falling=null;
    }

    // Bear - jumps over the sliding block
    if(bearJumping){
      bearVY+=.45;
      bearY+=bearVY;
      if(bearY>=0){bearY=0;bearVY=0;bearJumping=false;}
    }

    if(blocks.length>0){
      var top=blocks[blocks.length-1];
      var st=top.width<NARROW;
      var bw=st?Math.min(top.width*.9,50):Math.min(top.width*.7,85);
      var bh=st?bw*2.1:bw*1.2;
      var bx=top.x+top.width/2-bw/2;
      var by=top.y-yo-bh+bearY+3;
      dBear(ctx,selBear,bx,by,bw,bh,st);
    }

    // Particles
    for(var i=parts.length-1;i>=0;i--){
      var p=parts[i];p.x+=p.vx;p.vy+=p.g;p.y+=p.vy;p.a-=.018;
      if(p.a<=0){parts.splice(i,1);continue;}
      ctx.globalAlpha=p.a;ctx.fillStyle=p.c;
      ctx.beginPath();ctx.arc(p.x,p.y-yo,p.r,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;

    // Flash
    if(flash>0){ctx.fillStyle='rgba(255,255,255,'+flash+')';ctx.fillRect(0,0,W,H);flash*=.88;if(flash<.005)flash=0;}

    // HUD on top of everything
    drawHUD(yo);

    ctx.restore();

    // Move block with magnetic slowdown near center
    if(cur&&cur.moving&&running){
      var prev=blocks[blocks.length-1];
      var cd=Math.abs((cur.x+cur.width/2)-(prev.x+prev.width/2));
      // Slow down when close to aligned — feels like it "wants" to snap
      var magFactor=cd<MAGNET*2?(.5+.5*(cd/(MAGNET*2))):1;
      cur.x+=spd*dir*magFactor;
      if(cur.x+cur.width>W){cur.x=W-cur.width;dir=-1;}
      else if(cur.x<0){cur.x=0;dir=1;}
    }
    requestAnimationFrame(loop);
  }

  // ---- INPUT ----
  function tap(){
    if(!running)return;
    if(document.querySelector('.overlay.active'))return;
    document.getElementById('tapHint').style.display='none';
    place();
  }
  canvas.addEventListener('click',tap);
  canvas.addEventListener('touchstart',function(e){e.preventDefault();tap();},{passive:false});
  document.addEventListener('keydown',function(e){if(e.code==='Space'||e.key===' '){e.preventDefault();tap();}});

  // ---- GLOBAL API ----
  G.start=function(){
    document.getElementById('startOverlay').classList.remove('active');
    document.getElementById('gameOverOverlay').classList.remove('active');
    running=true;
    document.getElementById('tapHint').style.display='block';
    init();
  };
  G.openBears=function(){
    var grid=document.getElementById('bearGrid');grid.innerHTML='';
    for(var i=0;i<BEARS.length;i++){(function(b){
      var u=unlocked.indexOf(b.id)>=0,s=selBear===b.id;
      var card=document.createElement('div');
      card.className='bear-card'+(s?' selected':'')+(u?'':' locked');
      var cvs=document.createElement('canvas');cvs.width=60;cvs.height=64;
      var cc=cvs.getContext('2d');if(!u)cc.globalAlpha=.3;dBear(cc,b.id,5,2,50,58,false);
      card.appendChild(cvs);
      var nm=document.createElement('div');nm.className='bear-name';nm.textContent=b.name;card.appendChild(nm);
      if(!u){var ul=document.createElement('div');ul.className='bear-unlock';ul.textContent='Score '+b.unlock;card.appendChild(ul);var lk=document.createElement('div');lk.className='lock-icon';lk.textContent='🔒';card.appendChild(lk);}
      if(u)card.onclick=function(){selBear=b.id;save();G.openBears();};
      grid.appendChild(card);
    })(BEARS[i]);}
    document.getElementById('bearOverlay').classList.add('active');
  };
  G.closeBears=function(){document.getElementById('bearOverlay').classList.remove('active');};

  // ---- BOOT ----
  load();mkStars();init();running=false;loop();
})();
</script>
</body>
